<!-- The card ANATOMY — .frame/.left/.eyebrow/.title/.essence/.sub/.chips/.right/
     .panel/.foot/.stat — is shared with heroes. Use those classes rather than
     re-deriving them; a poster and a hero are the same 1200×630 artifact. -->
<link rel="stylesheet" href="/_kit/viz-og.css">
<!-- The MECHANICS (scale-to-fit). Shared, so a fix reaches every poster. -->
<link rel="stylesheet" href="/_kit/poster.css">
<style>
  /* Yours. Override kit tokens here to re-theme the whole card in a few lines:
     :root { --bg:#081428; --accent:#37d9a0; }
     Add only what DIFFERS from the kit — restating a kit component is how it
     quietly becomes a fork. */
  html, body { margin: 0; background: var(--bg) }
</style>
</head>
<body class="og-poster">
<div id="fit">
  <div class="og-card">
    <div class="frame"></div>
    <!-- Author your 1200×630 card here, using the kit's card anatomy. Keep key
         content inside the center ~1080×565 safe zone (link platforms crop ~60px
         off the sides / 32px top-bottom when unfurling). Drop `.right` for a
         full-bleed title card, `.left` for a figure-only one. -->
    <div class="left">
      <div class="eyebrow"><span class="dot"></span>Poster title</div>
      <h1 class="title">The one idea.<br><span class="hl">In four words.</span></h1>
      <div class="essence">The sentence someone should walk away with — a claim, not a description.</div>
    </div>
    <div class="right">
      <div class="panel">
        <div class="panel-cap"><span class="t">What this shows</span><span class="s">the qualifier</span></div>
        <!-- your figure -->
      </div>
    </div>
  </div>
</div>
<script type="module" src="/_kit/poster.js"></script>
</body>
