<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__SLUG__</title>
<!-- posture/listing — flip to public + listed when you mean to share this card (SKILL.md Step 4) -->
<meta name="viz:posture" content="local">
<meta name="viz:listed" content="unlisted">
<meta name="viz:kind" content="explanatory">
<meta name="viz:title" content="__SLUG__">
<meta name="viz:description" content="">
<!-- viz:card=self — THIS page IS its own 1200×630 OG card; verify.ts --og clips .og-card straight to og.auto.png. -->
<meta name="viz:card" content="self">
<link rel="stylesheet" href="/_kit/viz-kit.css">
<style>
  /* POSTER + DIVE: a 1200×630 OG card that is ALSO the top of a scrollable page.
     The card stays a pixel-exact clip target for `verify.ts --og`; everything below
     .og-card is a normal article nobody sees in the unfurled link preview.

     THE GOTCHA THIS SOLVES — do not "simplify" these three lines away:
     transform:scale() does NOT shrink an element's layout box. Unlock scrolling on a
     stock --poster and the card still reserves its full 630px, so a scaled-down card
     leaves a dead gap between itself and the prose below it. The fix is to scale from
     `top center` and drive #fit's height off the SAME --s the card is scaled by.

     The other difference from --poster: --s is capped at 1 (never upscale). A stock
     poster fills the viewport; here the card must stay the same measure as the text
     under it, or on a wide display you get a 2× card above 16px prose. */
  html,body{ margin:0; overflow-x:hidden; background:var(--bg); }
  #fit{ height:calc(630px * var(--s)); display:flex; justify-content:center; overflow:hidden; }
  .og-card{ position:relative; width:1200px; height:630px; flex:none; overflow:hidden;
            transform:scale(var(--s)); transform-origin:top center; }
  .og-card::after{ content:""; position:absolute; inset:0; border:1px solid var(--border); pointer-events:none; }

  .scroll-cue{ text-align:center; color:var(--muted); font-family:var(--mono);
               font-size:12px; padding:18px 0 0; }

  /* The dive. Its measure is deliberately narrower than the card — prose wants
     ~65-75 characters a line, the card wants 1200px. */
  .dive{ max-width:820px; margin:0 auto; padding:26px 28px 90px; }
  .dive h2{ font-size:12.5px; text-transform:uppercase; letter-spacing:.16em;
            color:var(--accent); margin:34px 0 10px; }
  .dive h2:first-of-type{ margin-top:18px; }
  .dive p{ font-size:16.5px; line-height:1.65; color:var(--text); margin:0 0 14px; }
  .dive p.m{ color:var(--muted); }
  .dive li{ font-size:16px; line-height:1.6; margin-bottom:9px; }
</style>
</head>
<body>

<div id="fit">
  <div class="og-card">
    <!-- Author your 1200×630 card here. Keep key content inside the center ~1080×565
         safe zone (link platforms crop ~60px off the sides / 32px top-bottom when
         unfurling). This is the ONLY part that becomes og.auto.png. -->
  </div>
</div>

<div class="scroll-cue">↓ scroll</div>

<article class="dive">
  <!-- Everything below the card. Invisible to the link preview, so this is where the
       detail goes that would have overcrowded the card. -->
  <h2>Section</h2>
  <p>Replace this.</p>
</article>

<script>
  // One --s drives BOTH the card's scale and #fit's reserved height — that shared
  // value is the whole trick. Capped at 1: see the note in <style>.
  //
  // Set it on documentElement, NOT on .og-card: custom properties inherit DOWNWARD,
  // and #fit is the card's PARENT. Setting it on the card (which is what the stock
  // --poster template does, correctly, because nothing else there reads --s) would
  // leave #fit's height:calc() resolving against an undefined --s.
  const fit = () =>
    document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1200, 1));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
