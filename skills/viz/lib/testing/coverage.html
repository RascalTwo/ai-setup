<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coverage</title>
<style>
  :root { --bg: #14181d; --panel: #1b2027; --line: #2b333d; --text: #e3e7ec; --muted: #8894a2; --run: #2f9e62; --miss: #d0473f; --part: #d69a2d; --skip: #5b6573; --pick: #5aa9f0; --only: #b07cf0; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: 300px 1fr 330px; grid-template-rows: auto 1fr; font: 13px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { grid-column: 1 / -1; display: flex; gap: 18px; align-items: baseline; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; } header b { font-size: 15px; } .muted { color: var(--muted); }
  aside, #side, main { overflow: auto; }
  aside { border-right: 1px solid var(--line); } #side { border-left: 1px solid var(--line); padding: 12px 14px; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 1; }
  .tabs button { flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 9px; font: inherit; cursor: pointer; }
  .tabs button[aria-pressed="true"] { color: var(--text); border-bottom-color: var(--pick); }
  .item { display: block; width: 100%; text-align: left; background: none; border: 0; border-left: 3px solid transparent; color: var(--text); padding: 6px 10px; font: inherit; cursor: pointer; }
  .item:hover { background: var(--panel); } .item[aria-current="true"] { background: var(--panel); border-left-color: var(--pick); }
  .item small { display: block; color: var(--muted); }
  details.group > summary { padding: 7px 10px; cursor: pointer; color: var(--muted); font-weight: 600; list-style-position: inside; }
  details.group > summary span { color: var(--muted); font-weight: 400; }
  details.group .item { padding-left: 24px; }
  .bar { height: 4px; background: var(--miss); border-radius: 2px; margin-top: 4px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--run); }
  .tag { font-size: 10.5px; padding: 0 6px; border-radius: 99px; background: #4a3a1a; color: #f3c775; margin-left: 4px; white-space: nowrap; }
  .tag.only { background: #3a2a55; color: #d6b8ff; }
  .tools { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 7px 12px; background: var(--bg); border-bottom: 1px solid var(--line); color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { background: none; border: 0; color: var(--muted); padding: 4px 9px; font: inherit; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--text); }
  .nav button { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 5px; padding: 2px 8px; cursor: pointer; font: inherit; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 4px 0 8px; vertical-align: -1px; }
  pre { margin: 0; font: 12px/1.6 ui-monospace, Menlo, monospace; }
  .ln { display: grid; grid-template-columns: 52px 34px 1fr; cursor: pointer; scroll-margin: 90px; }
  .ln:hover { background: #ffffff08; }
  .ln .n { color: #5d6875; text-align: right; padding-right: 10px; user-select: none; }
  .ln .g { text-align: center; font-size: 10.5px; color: #0c0f12; font-weight: 600; user-select: none; }
  .ln code { white-space: pre; padding-right: 20px; }
  .ln.run .g { background: var(--run); } .ln.miss .g { background: var(--miss); } .ln.part .g { background: var(--part); } .ln.skip .g { background: var(--skip); }
  .ln.miss code { background: #d0473f22; } .ln.skip code { opacity: .55; }
  .ln.only .g { background: var(--only); color: #fff; }
  .ln.dim { opacity: .3; } .ln.mine code { background: #5aa9f01c; } .ln.only code { background: #b07cf02a; }
  .ln.match code { box-shadow: inset 3px 0 0 var(--pick); background-color: #5aa9f026; }
  .ln.sel { outline: 1px solid var(--pick); outline-offset: -1px; }
  .untaken { text-decoration: underline wavy var(--part); text-decoration-thickness: 1.5px; text-underline-offset: 3px; background: #d69a2d1f; }
  /* Prism tokens, for a dark ground */
  .token.comment { color: #6b7686; font-style: italic; } .token.string, .token.template-string { color: #9fd08a; }
  .token.keyword { color: #d49bf0; } .token.function { color: #7cc3f5; } .token.number, .token.boolean { color: #f0a86c; }
  .token.operator, .token.punctuation { color: #aab3be; } .token.regex { color: #e7c16e; } .token.class-name { color: #f2d17c; }
  .token.property, .token.parameter, .token.literal-property { color: #e3e7ec; } .token.interpolation-punctuation { color: #d49bf0; }
  h2 { font-size: 13px; margin: 0 0 8px; } #side p { color: var(--muted); margin: 0 0 10px; }
  #side ul { list-style: none; padding: 0; margin: 0 0 14px; } #side li { margin-bottom: 5px; }
  #side a { color: var(--pick); cursor: pointer; text-decoration: none; } #side a:hover { text-decoration: underline; }
  #side code { font: 11.5px ui-monospace, Menlo, monospace; background: var(--panel); padding: 1px 4px; border-radius: 3px; }
  .note { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 10px; }
</style>
<script>window.Prism = { manual: true };</script>
<script>/*PRISM*/</script>
</head>
<body>
<header><h1 id="title"></h1><span id="totals"></span><span class="muted" id="when"></span></header>
<aside>
  <div class="tabs"><button data-tab="files" aria-pressed="true">Files</button><button data-tab="tests" aria-pressed="false">Tests</button></div>
  <div id="list"></div>
</aside>
<main>
  <div class="tools">
    <span>Highlight</span>
    <span class="seg" id="hl">
      <button data-hl="" aria-pressed="true">nothing</button>
      <button data-hl="miss">not run</button>
      <button data-hl="part">branch not taken</button>
      <button data-hl="one">run by one test</button>
    </span>
    <span class="nav" id="nav" hidden><button data-go="-1" title="previous (k)">▲</button> <span id="navpos"></span> <button data-go="1" title="next (j)">▼</button></span>
    <span class="legend"><i style="background:var(--run)"></i>run<i style="background:var(--part)"></i>branch not taken<i style="background:var(--miss)"></i>not run<i style="background:var(--skip)"></i>excluded<i style="background:var(--only)"></i>only the picked test</span>
  </div>
  <pre id="code"></pre>
</main>
<section id="side"></section>
<script>
const DATA = /*COVERAGE-DATA*/null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const pct = (a, b) => (b ? Math.floor((1000 * a) / b) / 10 : 100);
const plural = (n, one, many = one + "s") => `${n} ${n === 1 ? one : many}`;
const files = Object.keys(DATA.files), tests = Object.keys(DATA.tests).sort();
let tab = "files", test = null, line = null, hl = "", at = -1;
let file = files.slice().sort((a, b) => pct(DATA.files[a].covered, DATA.files[a].total) - pct(DATA.files[b].covered, DATA.files[b].total))[0];

// ---- source: highlight the whole file, then cut it into lines ---------------------------------------
// Tokenising line by line would break a comment or a template string that spans lines, so Prism
// tokenises the file once and each token's text is split at newlines, keeping its classes on every piece.
const lines = {}; // file → [[{ text, cls }]] per line
function tokenLines(f) {
  if (lines[f]) return lines[f];
  const src = DATA.files[f].source.join("\n"), grammar = /\.ts$/.test(f) ? Prism.languages.typescript : Prism.languages.javascript;
  const out = [[]];
  const walk = (tok, cls) => {
    if (typeof tok === "string") tok.split("\n").forEach((t, i) => { if (i) out.push([]); if (t) out.at(-1).push({ text: t, cls }); });
    else if (Array.isArray(tok)) tok.forEach((t) => walk(t, cls));
    else walk(tok.content, `${cls} token ${tok.type} ${[].concat(tok.alias ?? []).join(" ")}`.trim());
  };
  walk(Prism.tokenize(src, grammar), "");
  return (lines[f] = out);
}
// One line as HTML, with the characters no test ran through underlined.
function lineHtml(f, n) {
  const marks = DATA.files[f].untaken.filter((u) => u.line === n);
  let col = 0, html = "";
  for (const seg of tokenLines(f)[n - 1] ?? []) {
    const start = col, end = col + seg.text.length;
    let cuts = [start, end, ...marks.flatMap((m) => [m.from, m.to]).filter((c) => c > start && c < end)].sort((a, b) => a - b);
    cuts = [...new Set(cuts)];
    for (let i = 0; i < cuts.length - 1; i++) {
      const a = cuts[i], b = cuts[i + 1], text = seg.text.slice(a - start, b - start);
      const miss = marks.some((m) => a >= m.from && b <= m.to);
      html += `<span class="${seg.cls}${miss ? " untaken" : ""}">${esc(text)}</span>`;
    }
    col = end;
  }
  return html || " ";
}

// ---- a line's state --------------------------------------------------------------------------------
function state(f, n) {
  const c = DATA.files[f], ig = c.ignores.find((i) => i.line === n);
  if (ig) return { cls: "skip", why: ig.reason };
  if (c.missed.includes(n)) return { cls: "miss" };
  const by = c.by[n];
  if (!by) return null; // not code the coverage counts (blank, a comment, a brace), or excluded from above
  return { cls: c.missedBranches.includes(n) ? "part" : "run", by };
}
const matches = (f, n) => {
  const s = state(f, n);
  return hl === "miss" ? s?.cls === "miss" : hl === "part" ? s?.cls === "part" : hl === "one" ? s?.by?.length === 1 : false;
};

// ---- header, file list, test tree ------------------------------------------------------------------
function header() {
  let lc = 0, lt = 0, bc = 0, bt = 0;
  for (const c of Object.values(DATA.files)) { lc += c.covered; lt += c.total; bc += c.bCovered; bt += c.bTotal; }
  $("#title").textContent = `${DATA.viz} — coverage`;
  $("#totals").innerHTML = `lines <b>${pct(lc, lt)}%</b> · branches <b>${pct(bc, bt)}%</b> · ${tests.length} tests`;
  $("#when").textContent = new Date(DATA.at).toLocaleString();
}
function testItem(t, labelHtml) {
  const e = DATA.tests[t], n = Object.values(e.lines).reduce((a, l) => a + l.length, 0);
  return `<button class="item" data-test="${esc(t)}" aria-current="${t === test}">${labelHtml}${e.unique ? `<span class="tag only">${e.unique} only it runs</span>` : '<span class="tag" title="Every line it runs, another test runs too">no unique lines</span>'}<small>${plural(n, "line")} run</small></button>`;
}
function drawList() {
  for (const b of document.querySelectorAll(".tabs button")) b.setAttribute("aria-pressed", String(b.dataset.tab === tab));
  if (tab === "files") {
    $("#list").innerHTML = files.map((f) => { const c = DATA.files[f], p = pct(c.covered, c.total), notRun = c.total - c.covered;
      return `<button class="item" data-file="${esc(f)}" aria-current="${f === file}">${esc(f)}<small>lines ${p}% · branches ${pct(c.bCovered, c.bTotal)}% · ${notRun ? plural(notRun, "line") + " no test runs" : "every line run"}</small><div class="bar"><i style="width:${p}%"></i></div></button>`; }).join("");
    return;
  }
  // Tests as their describe() blocks: "Downloads › should …" goes under "Downloads".
  const groups = new Map();
  for (const t of tests) { const i = t.lastIndexOf(" › "), g = i < 0 ? "" : t.slice(0, i); (groups.get(g) ?? groups.set(g, []).get(g)).push(t); }
  $("#list").innerHTML = [...groups].map(([g, ts]) => {
    const items = ts.map((t) => testItem(t, esc(g ? t.slice(g.length + 3) : t))).join("");
    // A group of one is just that test, with its describe() as a quiet prefix: no fold to open.
    if (g && ts.length === 1) return testItem(ts[0], `<span class="muted">${esc(g)} ›</span> ${esc(ts[0].slice(g.length + 3))}`);
    return g ? `<details class="group" ${ts.includes(test) || groups.size < 6 ? "open" : ""}><summary>${esc(g)} <span>(${ts.length})</span></summary>${items}</details>` : items;
  }).join("");
}

// ---- the source view -------------------------------------------------------------------------------
function drawCode() {
  const c = DATA.files[file], mine = test ? new Set(DATA.tests[test].lines[file] ?? []) : null;
  $("#code").innerHTML = c.source.map((_, i) => {
    const n = i + 1, s = state(file, n), by = s?.by ?? [];
    const only = mine?.has(n) && by.length === 1;
    const cls = ["ln", s?.cls ?? "", mine && !mine.has(n) ? "dim" : "", mine?.has(n) ? "mine" : "", only ? "only" : "", hl && matches(file, n) ? "match" : "", n === line ? "sel" : ""].join(" ");
    const g = s?.cls === "miss" ? "✕" : s?.cls === "skip" ? "–" : only ? "only" : by.length || "";
    return `<div class="${cls}" id="L${n}" data-n="${n}" title="${s?.why ? "excluded: " + esc(s.why) : ""}"><span class="n">${n}</span><span class="g">${g}</span><code>${lineHtml(file, n)}</code></div>`;
  }).join("");
  drawNav();
}
// ▲▼ walk the highlighted lines (or the picked test's own lines) without hiding anything around them.
function targets() {
  const c = DATA.files[file];
  if (hl) return c.source.map((_, i) => i + 1).filter((n) => matches(file, n));
  if (test) return (DATA.tests[test].lines[file] ?? []).filter((n) => c.by[n]?.length === 1).sort((a, b) => a - b);
  return [];
}
function drawNav() {
  const t = targets(), nav = $("#nav");
  nav.hidden = !t.length;
  $("#navpos").textContent = t.length ? `${at >= 0 ? at + 1 : "–"} of ${t.length} ${hl ? "" : "only-this-test lines"}` : "";
}
function go(step) {
  const t = targets(); if (!t.length) return;
  at = (at + step + t.length) % t.length;
  line = t[at];
  drawCode(); drawSide();
  document.getElementById("L" + line)?.scrollIntoView({ block: "center" });
}

// ---- the side panel --------------------------------------------------------------------------------
const quote = (f, n) => `<code>${esc((DATA.files[f].source[n - 1] ?? "").trim().slice(0, 60))}</code>`;
function drawSide() {
  const side = $("#side");
  if (test) {
    const e = DATA.tests[test];
    const uniq = Object.entries(e.lines).flatMap(([f, ls]) => ls.filter((n) => DATA.files[f].by[n]?.length === 1).map((n) => [f, n]));
    side.innerHTML = `<h2>${esc(test)}</h2><p>${plural(Object.values(e.lines).reduce((a, l) => a + l.length, 0), "line")} run · ${plural(e.unique, "line")} no other test runs.</p>`
      + (uniq.length ? `<h2>Only this test runs</h2><ul>${uniq.map(([f, n]) => `<li><a data-jump="${esc(f)}:${n}">${esc(f)}:${n}</a> ${quote(f, n)}</li>`).join("")}</ul>`
        : `<div class="note">Every line this test runs, another test runs too. It may still check something the others don't — coverage can't see assertions.</div>`)
      + `<h2>Files</h2><ul>${Object.entries(e.lines).map(([f, ls]) => `<li><a data-file="${esc(f)}">${esc(f)}</a> — ${plural(ls.length, "line")}</li>`).join("")}</ul><a data-clear>Stop showing this test</a>`;
  } else if (line) {
    const s = state(file, line), arms = DATA.files[file].untaken.filter((u) => u.line === line);
    side.innerHTML = `<h2>${esc(file)}:${line}</h2>` + (!s ? `<p>Not code the coverage counts (blank, a comment, a brace), or excluded by a comment above it.</p>`
      : s.cls === "skip" ? `<p>Excluded from coverage:</p><div class="note">${esc(s.why || "NO REASON — verify fails until one is given")}</div>`
      : s.cls === "miss" ? `<p>No test runs this line.</p>`
      : (arms.length ? `<p>Run, but no test ever took:</p><ul>${arms.map((a) => `<li><code>${esc(a.code.trim().slice(0, 80))}</code></li>`).join("")}</ul>` : "")
        + `<p>Run by ${plural(s.by.length, "test")}:</p><ul>${s.by.map((t) => `<li><a data-test="${esc(t)}">${esc(t)}</a></li>`).join("")}</ul>`);
  } else {
    const c = DATA.files[file];
    side.innerHTML = `<h2>${esc(file)}</h2><p>Click a line to see which tests run it and, where a branch was never taken, exactly what. Pick a test to see its lines — and the ones only it runs, marked <b style="color:var(--only)">only</b>.</p>`
      + `<ul><li>${c.covered}/${c.total} lines run</li><li>${c.bCovered}/${c.bTotal} ways through branches taken</li><li>${plural(c.ignores.length, "exclusion")}</li></ul>`
      + (c.ignores.length ? `<h2>Exclusions</h2><ul>${c.ignores.map((i) => `<li>line ${i.line}: ${esc(i.reason || "NO REASON")}</li>`).join("")}</ul>` : "");
  }
}

// ---- wiring ----------------------------------------------------------------------------------------
const draw = () => { drawList(); drawCode(); drawSide(); };
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-tab],[data-file],[data-test],[data-n],[data-clear],[data-hl],[data-go],[data-jump]"); if (!t) return;
  if (t.dataset.go) return go(Number(t.dataset.go));
  if (t.dataset.tab) tab = t.dataset.tab;
  else if (t.dataset.hl !== undefined) { hl = t.dataset.hl; at = -1; for (const b of document.querySelectorAll("#hl button")) b.setAttribute("aria-pressed", String(b === t)); }
  else if (t.dataset.jump) { const [f, n] = [t.dataset.jump.replace(/:\d+$/, ""), Number(t.dataset.jump.match(/\d+$/)[0])]; file = f; line = n; drawCode(); drawList();
    return document.getElementById("L" + n)?.scrollIntoView({ block: "center" }); }
  else if (t.dataset.file) { file = t.dataset.file; line = null; at = -1; }
  else if (t.dataset.test) { test = t.dataset.test; line = null; at = -1; if (!DATA.tests[test].lines[file]) file = Object.keys(DATA.tests[test].lines)[0]; tab = "tests"; draw(); return go(1); }
  else if ("clear" in t.dataset) { test = null; at = -1; }
  else if (t.dataset.n) { line = Number(t.dataset.n); test = null; }
  draw();
});
addEventListener("keydown", (e) => { if (e.key === "j") go(1); if (e.key === "k") go(-1); });
header(); draw();
</script>
</body>
</html>
