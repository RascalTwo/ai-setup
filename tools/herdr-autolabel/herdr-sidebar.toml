# herdr-autolabel's sidebar row. Merged into ~/.config/herdr/config.toml by
# install.ts. Row 1 is the status dot plus the tab name this tool keeps current. Row 2 is two
# session metrics, reported by tools/statusline/statusline-*.sh into ONE token per metric, so the
# colour follows those widgets (the unreported ones vanish): context used ("142k", one token per
# colour band), then the prompt-cache countdown ("42m": gray / orange <=15m / red expired).
# separator / indent / continuation_indent only exist in the RascalTwo/herdr fork (stock herdr
# hardcodes " · " and indents 1 / 3, and just warns "unknown config key" about these three).
[ui.sidebar.agents]
separator = " "
indent = 0
continuation_indent = 0
wrap = true                   # long tab names (agent tasks) wrap onto more lines instead of truncating (fork-only)
rows = [["state_icon", "tab"], [{ token = "$ctx_g", fg = "#87d787" }, { token = "$ctx_y", fg = "#ffff5f" }, { token = "$ctx_o", fg = "#ff8700" }, { token = "$ctx_m", fg = "#ff5fff" }, { token = "$ctx_r", fg = "#ff0000" },
  { token = "$cache_ok", fg = "#8a8a8a" }, { token = "$cache_warn", fg = "#ffaf00" }, { token = "$cache_exp", fg = "#ff0000" }]]

# Spaces sidebar: a space is its status dot + name, and under it the least prompt-cache time left
# among its sessions ("34m", same colours as an agent's), from statusline/herdr-space-cache.sh. The stock second row (git branch and
# status) is dropped: a project space's agents each work on their own branch, so one branch
# per space says nothing.
[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], [{ token = "$spcache_ok", fg = "#8a8a8a" }, { token = "$spcache_warn", fg = "#ffaf00" }, { token = "$spcache_exp", fg = "#ff0000" }]]
waiting_first = true   # a Space's dot shows an agent waiting on you over one working (fork-only)
