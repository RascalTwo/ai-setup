<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How I Use AI</title>
<meta name="viz:posture" content="public">
<meta name="viz:listed" content="listed">
<meta name="viz:title" content="How I Use AI">
<meta name="viz:description" content="An explorable of Rascal's AI usage philosophy — fifteen principles across three arcs, scored against the four things I think the work asks of me: teacher, leader, expert, owner.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/_kit/viz-kit.css">
<style>
  :root{
    --rail-w: 306px;
    --glass: color-mix(in srgb, var(--panel) 72%, transparent);
    --arc1: var(--c1);
    --arc2: var(--c2);
    --arc3: var(--c3);
    /* The four values. Kit slots c2/c3/c6 alias good/warn/danger — a scorecard
       must not render a value in error-red — and c7/c8 are too dark to read on
       --panel at this cell size, so those two are re-themed brighter here. */
    --v-teacher: var(--c4);   /* violet   */
    --v-leader:  var(--c5);   /* teal     */
    --v-expert:  #8ea2ff;     /* periwinkle — brighter sibling of c7 */
    --v-owner:   #f2789f;     /* rose      — brighter sibling of c8 */
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:
      radial-gradient(1100px 620px at 82% -8%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 60%),
      radial-gradient(900px 520px at -6% 108%, color-mix(in srgb, var(--c4) 12%, transparent), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    overflow:hidden;
  }
  .app{ display:grid; grid-template-rows:auto 1fr; height:100dvh; }

  /* ---- header ---- */
  header.top{
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
    padding:16px 26px 14px; border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, color-mix(in srgb, var(--panel) 55%, transparent), transparent);
  }
  header.top h1{ font-size:20px; margin:0; letter-spacing:.2px; }
  header.top h1 .q{ color:var(--muted); font-weight:500; }
  header.top .spacer{ flex:1; }
  header.top .hint{ color:var(--muted); font-size:12px; font-family:var(--mono); }
  header.top .hint kbd{
    font-family:var(--mono); background:var(--panel-2); border:1px solid var(--border);
    border-bottom-width:2px; border-radius:5px; padding:1px 6px; color:var(--text); font-size:11px;
  }

  /* ---- body layout ---- */
  .body{ display:grid; grid-template-columns:var(--rail-w) 1fr; min-height:0; }

  /* ---- rail ---- */
  nav.rail{
    border-right:1px solid var(--border); padding:16px 14px; overflow-y:auto;
    background:linear-gradient(180deg, color-mix(in srgb, var(--panel) 40%, transparent), transparent);
  }
  .rail-title{ font-size:11px; text-transform:uppercase; letter-spacing:.14em; color:var(--muted); margin:2px 8px 12px; }
  .arc-head{
    display:flex; align-items:center; gap:8px; margin:16px 8px 6px;
    font-size:10.5px; text-transform:uppercase; letter-spacing:.13em; color:var(--muted);
  }
  .arc-head .bar{ width:16px; height:3px; border-radius:2px; background:var(--ac, var(--accent)); flex:none; }
  .arc-head .cnt{ margin-left:auto; font-family:var(--mono); opacity:.6; }
  .step{
    position:relative; display:flex; gap:11px; align-items:center; width:100%;
    text-align:left; cursor:pointer; color:var(--text);
    background:transparent; border:1px solid transparent; border-radius:11px;
    padding:7px 10px; margin:1px 0; font:inherit; transition:background .15s, border-color .15s;
  }
  .step:hover{ background:var(--panel); }
  .step .chip{
    flex:none; width:25px; height:25px; border-radius:8px; display:grid; place-items:center;
    font-family:var(--mono); font-size:11.5px; font-weight:600;
    background:var(--panel-2); border:1px solid var(--border); color:var(--muted);
  }
  .step .lbl{ font-size:13px; line-height:1.25; }
  .step.active{ background:color-mix(in srgb, var(--ac, var(--accent)) 16%, transparent); border-color:color-mix(in srgb, var(--ac, var(--accent)) 48%, transparent); }
  .step.active .chip{ background:var(--ac, var(--accent)); border-color:var(--ac, var(--accent)); color:#04121f; }
  .step.active .lbl{ color:var(--text); font-weight:600; }
  .step.seen .chip{ color:var(--ac, var(--accent)); border-color:color-mix(in srgb, var(--ac, var(--accent)) 45%, transparent); }
  .step.dim{ opacity:.28; }
  .rail-foot{ margin:18px 8px 6px; padding-top:14px; border-top:1px solid var(--border); color:var(--muted); font-size:12px; line-height:1.55; }
  .rail-foot a{ color:var(--accent); text-decoration:none; }
  .rail-foot a:hover{ text-decoration:underline; }

  /* ---- stage ----
     The footer lives OUTSIDE the scroll container so Prev/Next hold the same
     screen position on every stop, instead of tracking each stop's height. */
  main.stage{ display:grid; grid-template-rows:minmax(0,1fr) auto; min-height:0; }
  .stage-scroll{ position:relative; min-height:0; overflow-y:auto; padding:32px 40px 26px; }
  .watermark{
    position:absolute; top:-14px; right:26px; font-family:var(--mono); font-weight:700;
    font-size:190px; line-height:1; color:color-mix(in srgb, var(--ac, var(--accent)) 9%, transparent);
    pointer-events:none; user-select:none; letter-spacing:-6px;
  }
  .stage-grid{ position:relative; display:grid; grid-template-columns:minmax(0,1fr) 356px; gap:34px; max-width:1120px; align-items:start; }
  .eyebrow{ display:inline-flex; align-items:center; gap:9px; color:var(--ac, var(--accent)); font-family:var(--mono); font-size:12px; letter-spacing:.05em; margin-bottom:11px; }
  .eyebrow .dot{ width:7px; height:7px; border-radius:50%; background:currentColor; box-shadow:0 0 0 4px color-mix(in srgb, currentColor 22%, transparent); }
  h2.title{ font-size:29px; line-height:1.13; margin:0 0 14px; letter-spacing:-.3px; }

  /* serves badges */
  .serves{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin:0 0 16px; }
  .serves .sl{ font-size:11px; color:var(--muted); font-family:var(--mono); letter-spacing:.06em; text-transform:uppercase; }
  .vtag{
    display:inline-flex; align-items:center; gap:6px; cursor:pointer; font:inherit; font-size:11.5px;
    background:transparent; color:var(--vc); border:1px solid color-mix(in srgb, var(--vc) 45%, transparent);
    border-radius:999px; padding:3px 11px 3px 8px; font-family:var(--mono); letter-spacing:.03em;
    transition:background .15s;
  }
  .vtag:hover{ background:color-mix(in srgb, var(--vc) 16%, transparent); }
  .vtag i{ width:6px; height:6px; border-radius:50%; background:var(--vc); font-style:normal; }

  .lead{
    font-size:18px; line-height:1.5; color:var(--text); margin:0 0 20px;
    padding-left:16px; border-left:3px solid color-mix(in srgb, var(--ac, var(--accent)) 60%, transparent);
  }
  .lead em{ color:var(--ac, var(--accent)); font-style:italic; }
  ul.points{ list-style:none; margin:0; padding:0; display:grid; gap:10px; }
  ul.points li{ position:relative; padding-left:26px; font-size:14.5px; line-height:1.5; color:var(--text); }
  ul.points li::before{
    content:""; position:absolute; left:4px; top:8px; width:8px; height:8px; border-radius:2px;
    background:var(--ac, var(--accent)); transform:rotate(45deg);
  }
  ul.points li b{ color:#fff; font-weight:600; }
  ul.points li .m{ color:var(--muted); }
  .visual{ position:sticky; top:0; }
  .visual .frame{
    background:var(--glass); border:1px solid var(--border); border-radius:16px; padding:16px;
    box-shadow:0 20px 50px -30px rgba(0,0,0,.9); backdrop-filter:blur(3px);
  }
  .visual svg{ width:100%; height:auto; display:block; }
  .visual .cap{ margin-top:10px; color:var(--muted); font-size:12px; text-align:center; font-family:var(--mono); line-height:1.5; }
  .visual .cap b{ color:var(--ac, var(--accent)); font-weight:600; }
  /* No opacity here — it dropped the only instruction for the only control to
     3.94:1. Plain --muted on --bg is 6.19:1 and passes AA. */
  .visual .drivehint{
    margin-top:9px; text-align:center; font-size:11px; font-family:var(--mono);
    color:var(--muted); letter-spacing:.04em;
  }
  ul.points li a, .rail-foot a, .lead a{ color:var(--ac, var(--accent)); text-decoration:underline; text-underline-offset:2px; }
  ul.points li a:hover{ text-decoration-thickness:2px; }

  /* svg shared bits */
  .s-stroke{ stroke:var(--ac, var(--accent)); fill:none; stroke-width:2; }
  .s-mut{ stroke:var(--muted); fill:none; stroke-width:1.6; }
  .s-fill{ fill:var(--ac, var(--accent)); }
  .s-mfill{ fill:var(--muted); }
  .s-txt{ fill:var(--text); font-family:var(--mono); font-size:12px; }
  .s-txtm{ fill:var(--muted); font-family:var(--mono); font-size:11px; }
  .s-good{ stroke:var(--good); }
  .s-danger{ stroke:var(--danger); }
  .dash{ stroke-dasharray:5 5; }

  /* ---- landing ---- */
  .creed-lead{ font-size:21px; line-height:1.45; max-width:820px; margin:0 0 8px; }
  .creed-lead b{ color:var(--accent); }
  .sec-h{
    display:flex; align-items:baseline; gap:12px; margin:30px 0 4px; max-width:1120px;
    font-size:12px; font-family:var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--accent);
  }
  .sec-h .rule{ flex:1; height:1px; background:var(--border); }
  .sec-sub{ color:var(--muted); font-size:13.5px; margin:0 0 16px; max-width:820px; line-height:1.55; }

  /* matrix */
  .matrix-wrap{
    background:var(--glass); border:1px solid var(--border); border-radius:16px;
    padding:18px 20px 14px; max-width:1120px; backdrop-filter:blur(3px);
  }
  .matrix-wrap svg{ width:100%; height:auto; display:block; overflow:visible; }
  .mcell{ cursor:pointer; transition:opacity .15s; }
  .mrow-lbl{ cursor:pointer; }
  .mrow-lbl:hover text{ fill:#fff; }
  .mcol-lbl{ cursor:pointer; }
  .m-dim{ opacity:.16; }
  .matrix-read{
    display:flex; align-items:center; gap:12px; margin-top:12px; padding-top:12px;
    border-top:1px solid var(--border); font-size:13.5px; line-height:1.5; color:var(--text); min-height:42px;
  }
  .matrix-read .badge{
    flex:none; font-family:var(--mono); font-size:11px; padding:3px 10px; border-radius:999px;
    border:1px solid color-mix(in srgb, var(--rc, var(--accent)) 45%, transparent); color:var(--rc, var(--accent));
  }
  .matrix-read .m{ color:var(--muted); }

  /* creed */
  .creed-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(252px,1fr)); gap:11px; max-width:1120px; }
  .creed-card{
    background:var(--panel); border:1px solid var(--border); border-left:3px solid var(--c-l, var(--accent));
    border-radius:11px; padding:12px 14px; font-size:13.5px; line-height:1.45; cursor:pointer;
    transition:transform .12s, background .15s;
  }
  .creed-card:hover{ transform:translateY(-2px); background:var(--panel-2); }
  .creed-card .n{ font-family:var(--mono); font-size:11px; color:var(--muted); display:block; margin-bottom:4px; }
  .creed-card b{ color:#fff; }

  /* ---- footer nav (pinned) ---- */
  .stage-foot{
    display:flex; align-items:center; gap:16px;
    padding:13px 40px; border-top:1px solid var(--border);
    background:linear-gradient(0deg, color-mix(in srgb, var(--panel) 60%, transparent), transparent);
  }
  .btn{
    display:inline-flex; align-items:center; gap:8px; cursor:pointer; font:inherit; font-size:13.5px;
    background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:9px 15px;
    transition:background .15s, border-color .15s, opacity .15s;
  }
  .btn:hover{ background:var(--panel-2); border-color:var(--accent); }
  .btn[disabled]{ opacity:.35; pointer-events:none; }
  .btn.primary{ background:var(--ac, var(--accent)); color:#04121f; border-color:var(--ac, var(--accent)); font-weight:600; }
  .dots{ display:flex; gap:6px; flex:1; justify-content:center; flex-wrap:wrap; }
  .dots button{ width:9px; height:9px; padding:0; border-radius:50%; border:none; cursor:pointer; background:var(--border); transition:transform .15s; }
  .dots button:hover{ transform:scale(1.4); }
  .dots button.on{ background:var(--dc, var(--accent)); }
  .counter{ color:var(--muted); font-family:var(--mono); font-size:12px; min-width:60px; text-align:right; }

  .reveal{ animation:rise .32s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rise{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:none;} }
  @media (prefers-reduced-motion: reduce){ .reveal{ animation:none; } }

  @media (max-width:980px){
    .body{ grid-template-columns:1fr; }
    nav.rail{ display:none; }
    .stage-grid{ grid-template-columns:1fr; }
    .visual{ position:static; order:-1; }
    .watermark{ font-size:120px; right:12px; }
    .stage-scroll{ padding:22px 20px 20px; }
    .stage-foot{ padding:12px 20px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>How I Use AI <span class="q">— the working philosophy</span></h1>
    <div class="spacer"></div>
    <div class="hint"><kbd>←</kbd> <kbd>→</kbd> move · <kbd>Home</kbd> start</div>
  </header>
  <div class="body">
    <nav class="rail" id="rail"></nav>
    <main class="stage">
      <div class="stage-scroll" id="stage"></div>
      <div class="stage-foot" id="foot"></div>
    </main>
  </div>
</div>

<script type="module">
import { saveHash, loadHash, esc } from "/_kit/viz.js";

/* ============================================================
   THE FOUR VALUES — the columns everything gets scored against.
   Not my invention; they're what I think the work asks of me,
   and the reason this page is arranged the way it is.
   ============================================================ */
/* The page tells you to go and take the setup; it had better say where from. */
const REPO = "https://github.com/RascalTwo/ai-setup";
const TOUR = "../rascal-ai-setup-tour/";

const VALUES = [
  { key:"teacher", label:"Be a teacher", c:"var(--v-teacher)",
    blurb:"AI amplifies whatever pattern you already follow, so somebody has to set the pattern — and then hand it on." },
  { key:"leader",  label:"Be a leader",  c:"var(--v-leader)",
    blurb:"Model the use deliberately wherever you have influence. Finding a better way to work is part of the job, not a hobby." },
  { key:"expert",  label:"Be an expert", c:"var(--v-expert)",
    blurb:"It is fluent without understanding. It answers the question you asked, not the one you should have — you're the difference." },
  { key:"owner",   label:"Be an owner",  c:"var(--v-owner)",
    blurb:"Accountability doesn't transfer. Authorship is never an alibi, and 'the agent wrote it' has never once been a defence." },
];
const VC = Object.fromEntries(VALUES.map(v => [v.key, v.c]));

/* ---------- bespoke SVG metaphors (300 x 240 viewBox) ---------- */
const V = (inner) => `<svg viewBox="0 0 300 240" role="img">${inner}</svg>`;
const AH = (id, col) => `<marker id="${id}" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="${col}"/></marker>`;

const ART = {
  /* 1 — RACI: keep the A, delegate the R */
  raci: V(`
    <text x="150" y="20" text-anchor="middle" class="s-txtm">means → end</text>
    <rect x="34" y="70" width="86" height="58" rx="10" class="s-stroke" data-viz-id="raci-a" data-label="accountability, kept"/>
    <text x="77" y="100" text-anchor="middle" class="s-fill" style="font-family:var(--mono);font-weight:700;font-size:22px">A</text>
    <text x="77" y="118" text-anchor="middle" class="s-txtm">accountable</text>
    <line x1="77" y1="128" x2="77" y2="192" class="s-stroke"/>
    <path d="M67 186 h20 l-10 14 Z" class="s-fill"/>
    <text x="77" y="222" text-anchor="middle" class="s-txtm">stays on me</text>
    <rect x="180" y="70" width="86" height="58" rx="10" class="s-mut dash" data-viz-id="raci-r" data-label="responsibility, delegated"/>
    <text x="223" y="100" text-anchor="middle" class="s-mfill" style="font-family:var(--mono);font-weight:700;font-size:22px">R</text>
    <text x="223" y="118" text-anchor="middle" class="s-txtm">the doing</text>
    <path d="M126 99 h48" class="s-stroke" marker-end="url(#ah-raci)"/>
    <text x="150" y="58" text-anchor="middle" class="s-txt">delegate ▸</text>
    <rect x="196" y="176" width="54" height="34" rx="8" class="s-mut"/>
    <text x="223" y="197" text-anchor="middle" class="s-txtm">AI</text>
    <line x1="223" y1="128" x2="223" y2="172" class="s-mut dash"/>
    <defs>${AH("ah-raci","var(--ac, var(--accent))")}</defs>`),

  /* 2 — make it yours: only your key fits */
  key: V(`
    <text x="150" y="24" text-anchor="middle" class="s-txtm">only the you-shaped key fits</text>
    <path d="M150 54 a34 34 0 1 0 .1 0 M150 88 v96 M150 150 h20 M150 170 h14" class="s-stroke" stroke-width="2.4" data-viz-id="key-mine" data-label="my own setup"/>
    <circle cx="150" cy="88" r="9" fill="var(--bg)" class="s-stroke"/>
    <g class="s-mut dash" opacity=".6">
      <path d="M58 150 a20 20 0 1 0 .1 0 M58 170 v34 M58 190 h12" data-viz-id="key-other-a" data-label="borrowed framework"/>
      <path d="M242 150 a20 20 0 1 0 .1 0 M242 170 v34 M242 188 h12" data-viz-id="key-other-b" data-label="borrowed framework"/>
    </g>
    <text x="58" y="222" text-anchor="middle" class="s-txtm">someone</text>
    <text x="242" y="222" text-anchor="middle" class="s-txtm">else's</text>
    <text x="150" y="214" text-anchor="middle" class="s-txt">you</text>`),

  /* 3 — atrophy vs re-engaged practice */
  atrophy: V(`
    <line x1="40" y1="200" x2="272" y2="200" class="s-mut"/>
    <line x1="40" y1="40" x2="40" y2="200" class="s-mut"/>
    <text x="30" y="46" text-anchor="end" class="s-txtm">skill</text>
    <path d="M40 70 C110 120, 190 165, 272 195" class="s-mut dash" data-viz-id="atrophy-slide" data-label="passive acceptance"/>
    <text x="252" y="214" text-anchor="middle" class="s-txtm">let it slide</text>
    <path d="M40 70 C110 74, 190 66, 272 60" class="s-stroke s-good" data-viz-id="atrophy-held" data-label="reps put back"/>
    <g fill="var(--good)">
      <rect x="96" y="62" width="7" height="7" rx="1.5" transform="rotate(45 99 65)"/>
      <rect x="160" y="58" width="7" height="7" rx="1.5" transform="rotate(45 163 61)"/>
      <rect x="224" y="55" width="7" height="7" rx="1.5" transform="rotate(45 227 58)"/>
    </g>
    <text x="150" y="30" text-anchor="middle" class="s-txt">demo · talk · teach = reps back</text>`),

  /* 4 — three lanes, not a fan: curved branches put labels on top of their own
         paths at this size, so the question sits above a straight lane instead. */
  fork: V(`
    <text x="150" y="22" text-anchor="middle" class="s-txtm">three answers, not two</text>
    <circle cx="24" cy="126" r="6" class="s-fill"/>
    <path d="M30 126 H44" class="s-stroke"/>
    <path d="M44 62 V190" class="s-stroke"/>

    <text x="48" y="54" class="s-txtm" style="font-size:9px">"can it do the WHOLE thing?"</text>
    <line x1="44" y1="62" x2="204" y2="62" class="s-mut" data-viz-id="fork-whole" data-label="can it do the whole thing — the wrong question"/>
    <line x1="214" y1="54" x2="230" y2="70" class="s-danger" stroke-width="2.4"/>
    <line x1="230" y1="54" x2="214" y2="70" class="s-danger" stroke-width="2.4"/>
    <text x="238" y="66" class="s-txtm" style="font-size:9px" fill="var(--danger)">wrong Q</text>

    <text x="48" y="118" class="s-txtm" style="font-size:9px">"can it HELP with the worst part?"</text>
    <line x1="44" y1="126" x2="206" y2="126" class="s-stroke s-good" data-viz-id="fork-help" data-label="help with the worst part — ship it"/>
    <path d="M206 119 l13 7 l-13 7" class="s-stroke s-good"/>
    <text x="228" y="130" class="s-txtm" style="font-size:9px" fill="var(--good)">ship</text>

    <text x="48" y="182" class="s-txtm" style="font-size:9px">"or is this one mine to do?"</text>
    <line x1="44" y1="190" x2="204" y2="190" stroke="var(--warn)" stroke-width="1.8" data-viz-id="fork-stop" data-label="set it down — this one is mine"/>
    <line x1="216" y1="182" x2="216" y2="198" stroke="var(--warn)" stroke-width="3"/>
    <line x1="226" y1="182" x2="226" y2="198" stroke="var(--warn)" stroke-width="3"/>
    <text x="238" y="194" class="s-txtm" style="font-size:9px" fill="var(--warn)">mine</text>`),

  /* 5 — lead the trail vs correct it */
  trail: V(`
    <text x="150" y="22" text-anchor="middle" class="s-txtm">blaze it, then it follows</text>
    <path d="M40 150 C100 150, 200 150, 260 150" class="s-stroke" stroke-dasharray="2 9" stroke-linecap="round" data-viz-id="trail-led" data-label="trail laid in advance"/>
    <path d="M256 143 l12 7 l-12 7" class="s-fill"/>
    <circle cx="70" cy="150" r="8" class="s-fill"/><text x="70" y="176" text-anchor="middle" class="s-txt">you</text>

/* Stops are not principles. Stop 0 is the thesis + scorecard, stop 1 is the
   compressed creed, and principles 1..N live at stops 2..N+1 — so the numbering
   the reader sees (1/15) stays independent of how many intro views there are. */
const N = P.length;
const TOTAL = N + 2;
const pnum   = (s) => s - 1;        // stop -> principle number
const stopOf = (p) => p + 1;        // principle number -> stop
const isP    = (s) => s >= 2;
const arcOf  = (p) => ARCS.find(a => a.id === P[p-1].arc);
const seen = new Set();
let filterValue = null;   // active value lens from the scorecard

/* ---------- DOM ---------- */
const rail  = document.getElementById("rail");
const stage = document.getElementById("stage");
const foot  = document.getElementById("foot");

/* ============================================================
   RAIL
   ============================================================ */
function buildRail(){
  const out = [`<div class="rail-title">The journey</div>`];
  out.push(`<button class="step" data-i="0" style="--ac:var(--accent)"><span class="chip">◆</span><span class="lbl">Thesis &amp; the scorecard</span></button>`);
  out.push(`<button class="step" data-i="1" style="--ac:var(--accent)"><span class="chip">≡</span><span class="lbl">The compressed version</span></button>`);
  ARCS.forEach(a => {
    const idxs = P.map((p,i)=>({p,i:i+1})).filter(x => x.p.arc === a.id);
    out.push(`<div class="arc-head" style="--ac:${a.c}"><span class="bar"></span>${esc(a.name)}<span class="cnt">${idxs.length}</span></div>`);
    idxs.forEach(({p,i}) => {
      out.push(`<button class="step" data-i="${stopOf(i)}" style="--ac:${a.c}"><span class="chip">${i}</span><span class="lbl">${esc(p.title)}</span></button>`);
    });
  });
  // The alt-click comment layer is injected by the dev server and never ships in a
  // frozen build, so the instruction for it must not ship either.
  const DEV = location.hostname === "127.0.0.1" || location.hostname === "localhost";
  out.push(`<div class="rail-foot">
      <span id="filterNote"></span>
      Fifteen principles, three arcs.<br>Dictated out loud, then made explorable.<br><br>
      <a href=\"../rascal-ai-setup-tour/\">See the machinery →</a><br>
      <a href="${REPO}">Take the setup ↗</a>
      ${DEV ? `<br><br><span style="opacity:.7">Alt-click anything to leave me a note.</span>` : ""}
    </div>`);
  rail.innerHTML = out.join("");
  rail.querySelectorAll(".step").forEach(b => b.addEventListener("click", () => go(+b.dataset.i)));
}

function paintRail(i){
  rail.querySelectorAll(".step").forEach(b => {
    const bi = +b.dataset.i;
    b.classList.toggle("active", bi === i);
    b.classList.toggle("seen", seen.has(bi) && bi !== i);
    const off = filterValue && isP(bi) && !P[pnum(bi)-1].serves.includes(filterValue);
    b.classList.toggle("dim", !!off);
  });
  const note = document.getElementById("filterNote");
  if(note){
    const v = filterValue && VALUES.find(x => x.key === filterValue);
    note.innerHTML = v
      ? `<span style="color:${v.c}">● lens: ${esc(v.label)}</span> — <a href="#" id="clearFilter">clear</a><br><br>`
      : "";
    const c = document.getElementById("clearFilter");
    if(c) c.onclick = (e) => { e.preventDefault(); clearFilter(); };
  }
}

function clearFilter(){
  filterValue = null;
  paintRail(cur);
  if(cur === 0) go(0);
}

/* ============================================================
   LANDING — thesis + the coverage matrix + the creed
   ============================================================ */
const MX = { padL:132, cellW:36, gap:5, rowH:30, rowGap:6, top:52 };

function matrixSVG(){
  const w = MX.padL + N * (MX.cellW + MX.gap) + 26;
  const h = MX.top + VALUES.length * (MX.rowH + MX.rowGap) + 34;
  const cellX = (i) => MX.padL + (i - 1) * (MX.cellW + MX.gap);
  const rowY = (r) => MX.top + r * (MX.rowH + MX.rowGap);
  const parts = [];

  // arc bands across the top
  ARCS.forEach(a => {
    const idxs = P.map((p,i)=>({p,i:i+1})).filter(x => x.p.arc === a.id).map(x => x.i);
    const x0 = cellX(idxs[0]), x1 = cellX(idxs[idxs.length-1]) + MX.cellW;
    parts.push(`<rect x="${x0}" y="14" width="${x1-x0}" height="4" rx="2" fill="${a.c}" opacity=".85"/>`);
    parts.push(`<text x="${(x0+x1)/2}" y="9" text-anchor="middle" class="s-txtm" style="font-size:9.5px">${esc(a.name)}</text>`);
  });

  // column headers (principle numbers)
  for(let i=1;i<=N;i++){
    parts.push(`<g class="mcol-lbl" data-jump="${stopOf(i)}"><rect x="${cellX(i)}" y="26" width="${MX.cellW}" height="18" fill="transparent"/>
      <text x="${cellX(i)+MX.cellW/2}" y="40" text-anchor="middle" class="s-txtm" style="font-size:10.5px">${i}</text></g>`);
  }

  // rows
  VALUES.forEach((v, r) => {
    const y = rowY(r);
    parts.push(`<g class="mrow-lbl" data-value="${v.key}">
      <rect x="0" y="${y}" width="${MX.padL-10}" height="${MX.rowH}" rx="6" fill="transparent"/>
      <rect x="0" y="${y+MX.rowH/2-8}" width="4" height="16" rx="2" fill="${v.c}"/>
      <text x="14" y="${y+MX.rowH/2+4}" class="s-txt" style="font-size:12px">${esc(v.label)}</text>
    </g>`);
    for(let i=1;i<=N;i++){
      const on = P[i-1].serves.includes(v.key);
      parts.push(`<rect class="mcell" data-value="${v.key}" data-jump="${stopOf(i)}"
        data-viz-id="cell-${v.key}-${i}" data-label="${esc(v.label)} × principle ${i}: ${on?'serves':'does not serve'}"
        x="${cellX(i)}" y="${y}" width="${MX.cellW}" height="${MX.rowH}" rx="6"
        fill="${on ? v.c : "var(--panel-2)"}" opacity="${on ? .88 : .5}"
        stroke="${on ? v.c : "var(--border)"}" stroke-width="1"/>`);
    }
  });

  // footer note
  const y = rowY(VALUES.length) + 12;
  parts.push(`<text x="0" y="${y}" class="s-txtm" style="font-size:10.5px">filled = this principle is doing that job</text>`);
  parts.push(`<text x="${w-26}" y="${y}" text-anchor="end" class="s-txtm" style="font-size:10.5px">click a row to highlight it · click a column to jump</text>`);

  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Coverage matrix: four values by fifteen principles">${parts.join("")}</svg>`;
}

function renderThesis(){
  return `
    <div class="reveal" style="--ac:var(--accent)">
      <div class="eyebrow"><span class="dot"></span>THE ONE-PARAGRAPH VERSION</div>
      <p class="creed-lead">AI is a <b>means to an end</b> — a tool, not the solution. My job is to stay the <b>problem solver</b>; the tool does the typing. The leverage only showed up once I stopped wearing other people's setups and <b>built one that fits how I work</b> — and then again, later, once I stopped treating it as a thing I did alone.</p>

      <div class="sec-h">Scored against the four<span class="rule"></span></div>
      <p class="sec-sub">There are four things this work asks of me: <b>be a teacher, be a leader, be an expert, be an owner.</b> Every principle here is doing at least one of those jobs. Drawing this scorecard is what told me the third arc was missing — until I did, nearly everything I'd written down was about me alone at a keyboard, and one whole row had almost nothing pointing at it.</p>
      <div class="matrix-wrap">
        ${matrixSVG()}
        <div class="matrix-read" id="mread">
          <span class="badge">hover</span>
          <span class="m">Point at a row to read what that value asks for. Click it to highlight which principles serve it; click a column to jump to that principle.</span>
        </div>
      </div>
    </div>`;
}

function renderCreed(){
  return `
    <div class="reveal" style="--ac:var(--accent)">
      <div class="eyebrow"><span class="dot"></span>THE COMPRESSED VERSION</div>
      <p class="creed-lead">Fifteen one-liners, in order — <b>the whole philosophy at a glance.</b></p>
      <p class="sec-sub">Colour is the arc it belongs to. Click any card to jump straight to its principle.</p>
      <div class="creed-grid">
        ${P.map((p,i)=>`
          <div class="creed-card" data-jump="${stopOf(i+1)}" style="--c-l:${arcOf(i+1).c}">
            <span class="n">${String(i+1).padStart(2,"0")} · ${esc(p.tag)}</span>${p.creed}
          </div>`).join("")}
      </div>
    </div>`;
}

/* ============================================================
   PRINCIPLE SCREEN
   ============================================================ */
function servesRow(p){
  return `<div class="serves"><span class="sl">serves</span>${
    p.serves.map(k => {
      const v = VALUES.find(x => x.key === k);
      return `<button class="vtag" data-value="${k}" style="--vc:${v.c}" title="${esc(v.blurb)}"><i></i>${esc(v.label)}</button>`;
    }).join("")
  }</div>`;
}

function renderPrinciple(n){
  const p = P[n-1], a = arcOf(n);
  const idx = n;
  return `
    <div class="reveal" style="--ac:${a.c}">
      <div class="watermark">${idx}</div>
      <div class="stage-grid">
        <div>
          <div class="eyebrow"><span class="dot"></span>${String(idx).padStart(2,"0")} · ${esc(p.tag).toUpperCase()} <span style="color:var(--muted)">· ${esc(a.name)}</span></div>
          <h2 class="title">${esc(p.title)}</h2>
          ${servesRow(p)}
          <p class="lead">${p.lead}</p>
          <ul class="points">${p.points.map(pt=>`<li>${pt}</li>`).join("")}</ul>
        </div>
        <aside class="visual">
          <div class="frame">
            <div id="artslot">${p.interactive ? "" : ART[p.art]}</div>
            <div class="cap" id="artcap">${p.cap}</div>
            ${p.interactive ? `<div class="drivehint">drag the marker</div>` : ""}
          </div>
        </aside>
      </div>
    </div>`;
}

/* The footer is rendered into its own pinned row, never inside the scroll area. */
function renderFoot(s){
  const dots = Array.from({length:TOTAL}, (_,i)=>{
    const c = isP(i) ? arcOf(pnum(i)).c : "var(--accent)";
    const t = i===0 ? "Thesis & the scorecard" : i===1 ? "The compressed version" : esc(P[pnum(i)-1].title);
    return `<button class="${i===s?'on':''}" data-i="${i}" style="--dc:${c}" title="${t}"></button>`;
  }).join("");
  const counter = isP(s) ? `${pnum(s)} / ${N}` : (s===0 ? "thesis" : "creed");
  const last = s === TOTAL - 1;
  foot.innerHTML = `
    <button class="btn" id="prev" ${s===0?'disabled':''}>← ${s===0?'':'Prev'}</button>
    <div class="dots">${dots}</div>
    <button class="btn primary" id="next" ${last?'disabled':''} style="--ac:${isP(s)?arcOf(pnum(s)).c:'var(--accent)'}">${last?'End':'Next'} →</button>
    <span class="counter">${counter}</span>`;
  document.getElementById("prev").onclick = () => go(s-1);
  document.getElementById("next").onclick = () => go(s+1);
  foot.querySelectorAll(".dots button").forEach(d => d.onclick = () => go(+d.dataset.i));
}

/* ============================================================
   THE INTERACTIVE PLANE (principle: climb the ladder, cap the width)
   x = concurrent sessions (1..8) · y = autonomy depth (1..5)
   shaded = where I can still explain any one of them
   ============================================================ */
/* This boundary is a rule of thumb I drew, not a measurement — and it is labelled
   as one on the page, because principle 07 is on the same site.
   The one thing it does encode is the asymmetry principle 06 argues for: an extra
   session costs TWICE what an extra rung of depth does, because depth is a choice
   you can walk back and width is one you make by accident. An earlier version used
   w * d <= 6, which is symmetric — it quietly claimed a rung and a session trade
   one-for-one, contradicting the very text it sat beside. */
const PLANE = { x0:40, x1:284, y0:190, y1:60, maxW:8, maxD:5, base:3.5, depthCost:0.5 };
const RUNGS = ["chat","autocomplete","it writes fns","it writes tests","you're just the user"];
let plane = { w:2, d:3 };

const px = (w) => PLANE.x0 + (w - 1) / (PLANE.maxW - 1) * (PLANE.x1 - PLANE.x0);
const py = (d) => PLANE.y0 - (d - 1) / (PLANE.maxD - 1) * (PLANE.y0 - PLANE.y1);
const safeW  = (d) => PLANE.base - (d - 1) * PLANE.depthCost;
const isSafe = (w, d) => w + (d - 1) * PLANE.depthCost <= PLANE.base;

function planeSVG(){
  const pts = [];
  for(let d = PLANE.maxD; d >= 1; d -= 0.25) pts.push(`${px(Math.max(1, safeW(d))).toFixed(1)},${py(d).toFixed(1)}`);
  const region = `M${px(1)},${py(PLANE.maxD)} L${pts.join(" L")} L${px(1)},${py(1)} Z`;
  const g = [];

  g.push(`<rect x="${PLANE.x0}" y="${PLANE.y1}" width="${PLANE.x1-PLANE.x0}" height="${PLANE.y0-PLANE.y1}" fill="var(--panel-2)" opacity=".35" rx="4"/>`);
  g.push(`<path d="${region}" fill="var(--good)" opacity=".16" stroke="var(--good)" stroke-width="1.5" data-viz-id="plane-safe" data-label="my rule-of-thumb boundary — where I reckon I can still explain the work"/>`);

  // rung gridlines — labels sit INSIDE the plot, above their line, so they can't
  // spill off the left edge the way an outside axis label does at this width.
  for(let d=1; d<=PLANE.maxD; d++){
    g.push(`<line x1="${PLANE.x0}" y1="${py(d)}" x2="${PLANE.x1}" y2="${py(d)}" stroke="var(--border)" stroke-width=".8"/>`);
    g.push(`<text x="${PLANE.x0+4}" y="${py(d)-4}" class="s-txtm" style="font-size:8px" opacity=".85">${RUNGS[d-1]}</text>`);
  }
  for(let w=1; w<=PLANE.maxW; w++){
    g.push(`<text x="${px(w)}" y="${PLANE.y0+13}" text-anchor="middle" class="s-txtm" style="font-size:9px">${w}</text>`);
  }

  // axes + region labels. The shaded region hugs the lower-left, so that is where
  // "still yours" belongs — the upper-right is the corner that bites.
  g.push(`<text x="${(PLANE.x0+PLANE.x1)/2}" y="${PLANE.y0+27}" text-anchor="middle" class="s-txtm">concurrent sessions →</text>`);
  g.push(`<text x="${(PLANE.x0+PLANE.x1)/2}" y="${PLANE.y0+42}" text-anchor="middle" class="s-txtm" style="font-size:9px">one more session costs 2× one more rung</text>`);
  g.push(`<text x="${PLANE.x0}" y="${PLANE.y1-14}" class="s-txtm" style="font-size:9px">autonomy depth ↑</text>`);
  g.push(`<text x="${px(2.4)}" y="${py(1.55)}" class="s-txtm" style="font-size:8.5px" fill="var(--good)">still yours</text>`);
  g.push(`<text x="${PLANE.x1-4}" y="${PLANE.y1+14}" text-anchor="end" class="s-txtm" style="font-size:8.5px" fill="var(--danger)">carries your name anyway</text>`);

  // marker
  const ok = isSafe(plane.w, plane.d);
  const c = ok ? "var(--good)" : "var(--danger)";
  g.push(`<line x1="${px(plane.w)}" y1="${PLANE.y0}" x2="${px(plane.w)}" y2="${py(plane.d)}" stroke="${c}" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>`);
  g.push(`<line x1="${PLANE.x0}" y1="${py(plane.d)}" x2="${px(plane.w)}" y2="${py(plane.d)}" stroke="${c}" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>`);
  g.push(`<circle cx="${px(plane.w)}" cy="${py(plane.d)}" r="9" fill="${c}" opacity=".22"/>`);
  g.push(`<circle cx="${px(plane.w)}" cy="${py(plane.d)}" r="5.5" fill="${c}" stroke="var(--bg)" stroke-width="1.5"
            data-viz-id="plane-marker" data-label="${plane.w} session(s) at depth ${plane.d}"/>`);

  return `<svg viewBox="0 0 300 240" role="img" id="planeSvg"
            style="touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none"
            aria-label="Depth versus width plane">${g.join("")}</svg>`;
}

function planeCaption(){
  const ok = isSafe(plane.w, plane.d);
  const msg = ok
    ? `I'd still back myself to explain <b>every one of them.</b>`
    : `<span style="color:var(--danger)">I would not back myself to explain all ${plane.w} — and they'd carry my name regardless.</span>`;
  return `<b>${plane.w}</b> session${plane.w>1?"s":""} × <b>${RUNGS[plane.d-1]}</b><br>${msg}`
       + `<br><span style="opacity:.7;font-size:11px">my line, drawn — not a measurement</span>`;
}

function mountPlane(){
  const slot = document.getElementById("artslot");
  const cap  = document.getElementById("artcap");
  if(!slot) return;

  // Listeners bind to the CONTAINER, once — not to the <svg>. Re-rendering used to
  // replace the very element that held the pointer capture, so a drag died on its
  // first redraw and the control silently degraded to click-to-set.
  const draw = () => { slot.innerHTML = planeSVG(); cap.innerHTML = planeCaption(); };

  const set = (ev) => {
    const svg = slot.querySelector("#planeSvg");
    if(!svg) return;
    const r = svg.getBoundingClientRect();
    const sx = (ev.clientX - r.left) / r.width  * 300;
    const sy = (ev.clientY - r.top)  / r.height * 240;
    const w = Math.round(1 + (sx - PLANE.x0) / (PLANE.x1 - PLANE.x0) * (PLANE.maxW - 1));
    const d = Math.round(1 + (PLANE.y0 - sy) / (PLANE.y0 - PLANE.y1) * (PLANE.maxD - 1));
    const nw = Math.max(1, Math.min(PLANE.maxW, w));
    const nd = Math.max(1, Math.min(PLANE.maxD, d));
    if(nw !== plane.w || nd !== plane.d){ plane = { w:nw, d:nd }; draw(); }
  };

  let down = false;
  slot.addEventListener("pointerdown", e => {
    down = true;
    try{ slot.setPointerCapture(e.pointerId); }catch(_){}
    set(e);
  });
  slot.addEventListener("pointermove", e => { if(down) set(e); });
  const release = (e) => {
    down = false;
    if(e && e.pointerId != null){ try{ slot.releasePointerCapture(e.pointerId); }catch(_){} }
  };
  slot.addEventListener("pointerup", release);
  slot.addEventListener("pointercancel", release);

  draw();
}

/* ============================================================
   MATRIX INTERACTION
   ============================================================ */
function wireMatrix(){
  const read = document.getElementById("mread");
  if(!read) return;

  const show = (key) => {
    const v = VALUES.find(x => x.key === key);
    const n = P.filter(p => p.serves.includes(key)).length;
    read.style.setProperty("--rc", v.c);
    read.innerHTML = `<span class="badge">${esc(v.label)}</span><span>${esc(v.blurb)} <span class="m">— ${n} of ${N} principles.</span></span>`;
  };
  const reset = () => {
    read.style.removeProperty("--rc");
    read.innerHTML = `<span class="badge">${filterValue ? "filtering" : "hover"}</span><span class="m">${
      filterValue
        ? `Highlighting the principles that serve <b>${esc(VALUES.find(v=>v.key===filterValue).label)}</b>. Click the row again to clear.`
        : "Point at a row to read what that value asks for. Click it to highlight which principles serve it; click a column to jump to that principle."
    }</span>`;
  };

  const paint = () => {
    stage.querySelectorAll(".mcell").forEach(c => {
      c.classList.toggle("m-dim", !!filterValue && c.dataset.value !== filterValue);
    });
    paintRail(cur);
  };

  stage.querySelectorAll(".mrow-lbl, .mcell").forEach(el => {
    el.addEventListener("mouseenter", () => show(el.dataset.value));
    el.addEventListener("mouseleave", reset);
  });
  stage.querySelectorAll(".mrow-lbl").forEach(el => {
    el.addEventListener("click", () => {
      filterValue = filterValue === el.dataset.value ? null : el.dataset.value;
      paint(); reset();
    });
  });
  stage.querySelectorAll(".mcell, .mcol-lbl").forEach(el => {
    el.addEventListener("click", (e) => { e.stopPropagation(); go(+el.dataset.jump); });
  });
  paint(); reset();
}

/* ============================================================
   NAVIGATION
   ============================================================ */
let cur = 0;
function go(s){
  s = Math.max(0, Math.min(TOTAL - 1, s));
  cur = s; seen.add(s);
  stage.innerHTML = s === 0 ? renderThesis() : s === 1 ? renderCreed() : renderPrinciple(pnum(s));
  stage.scrollTop = 0;
  renderFoot(s);
  paintRail(s);

  stage.querySelectorAll(".creed-card[data-jump]").forEach(c => c.onclick = () => go(+c.dataset.jump));
  stage.querySelectorAll(".vtag").forEach(t => t.onclick = () => { filterValue = t.dataset.value; go(0); });

  if(s === 0) wireMatrix();
  if(isP(s) && P[pnum(s)-1].interactive) mountPlane();

  // role="img" with no accessible name is worse than no role at all — it hides the
  // contents and substitutes nothing. The caption already describes each metaphor,
  // so name every illustration from it (the plane sets its own label).
  if(isP(s)){
    const art = stage.querySelector(".visual svg");
    if(art && !art.getAttribute("aria-label")){
      art.setAttribute("aria-label", "Illustration: " + P[pnum(s)-1].cap.replace(/<[^>]+>/g, ""));
    }
  }

  saveHash({ p:s });
}

document.addEventListener("keydown", (e) => {
  if(e.target.matches("input,textarea")) return;
  // Space is deliberately NOT bound: the stage scrolls, and hijacking it also broke
  // Space-to-activate on a focused Prev/Next button (which then navigated forwards).
  if(e.key === "ArrowRight"){ e.preventDefault(); go(cur+1); }
  else if(e.key === "ArrowLeft"){ e.preventDefault(); go(cur-1); }
  else if(e.key === "Home"){ go(0); }
  else if(e.key === "End"){ go(TOTAL-1); }
  else if(e.key === "Escape" && filterValue){ clearFilter(); }
});

buildRail();
const h = loadHash();
go(typeof h.p === "number" ? h.p : 0);
</script>
</body>
