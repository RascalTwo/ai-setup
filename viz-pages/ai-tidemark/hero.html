<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ai-tidemark — hero card</title>
<!-- The OG / hero card for ai-tidemark. `viz verify <url> --og` renders THIS file and
     clips to .og-card → og.auto.png. The figure is drawn from fixtures/demo.json (the
     same generated data the published page shows), so it never carries real usage.
     Plain fetch, no /_kit/viz.js: publish inlines kit CSS into a hero, not kit JS. -->
<link rel="stylesheet" href="/_kit/viz-kit.css">
<link rel="stylesheet" href="/_kit/viz-og.css">
<style>
  :root { --src-claude: var(--c4); --src-codex: var(--c5); }
  html, body { margin: 0; background: #05060a; }
  .graph text { font-family: var(--mono); }
</style>
</head>
<body>

<div class="og-card">
  <div class="frame"></div>

  <div class="left">
    <div class="eyebrow"><span class="dot"></span>ai-tidemark</div>

    <h1 class="title">You paid for it.<br><span class="hl">Did you use it?</span></h1>

    <div class="essence">
      tidemark keeps the <span class="hl">high-water mark</span> of every
      5-hour and weekly window before the reset erases it.
    </div>


    <div class="chips">
      <span class="chip"><span class="tk"></span>5-hour + weekly</span>
      <span class="chip"><span class="tk"></span>Claude Code · Codex</span>
      <span class="chip"><span class="tk"></span>local data only</span>
    </div>
  </div>

  <div class="right">
    <div class="panel">
      <div class="panel-cap">
        <span class="t">One week, used vs. paid for</span>
        <span class="s">demo data</span>
      </div>
      <svg class="graph" id="fig" viewBox="0 0 392 200" fill="none" xmlns="http://www.w3.org/2000/svg"
           data-viz-id="hero-week" data-label="One demo week: weekly use against even pace, with the unused gap to 100%"></svg>
      <div class="foot">
        <div class="stat accent"><div class="n" id="used">—</div><div class="l">used</div><div class="d">the week's high-water mark</div></div>
        <div class="stat warn"><div class="n" id="gone">—</div><div class="l">expired</div><div class="d" id="goneD">reset away, unused</div></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  const WEEK = 168 * 3600e3, FIVE = 5 * 3600e3;
  const D = await (await fetch("fixtures/demo.json")).json();
  const src = (id) => D.sources.find((s) => s.id === id);
  const claude = src("claude").samples.filter((s) => s.q === "exact");
  // The most recent week that has closed.
  const r = Math.max(...claude.filter((s) => s.w === 10080 && s.r <= D.now).map((s) => s.r)), start = r - WEEK;
  const weekly = claude.filter((s) => s.w === 10080 && s.r === r).sort((a, b) => a.t - b.t);
  const fives = claude.filter((s) => s.w === 300 && s.r > start && s.r <= r);
  const cx = (src("codex")?.samples ?? []).filter((s) => s.w === 10080 && s.t >= start && s.t <= r).sort((a, b) => a.t - b.t);
  const peak = Math.max(...weekly.map((s) => s.v));

  const L = 34, R = 380, T = 12, B = 176;
  const x = (t) => L + ((t - start) / WEEK) * (R - L), y = (v) => B - (v / 100) * (B - T);
  const line = (pts, f) => pts.map((p, i) => `${i ? "L" : "M"}${x(p.t).toFixed(1)},${y(f(p)).toFixed(1)}`).join("");
  let s = "";
  for (const v of [0, 50, 100]) s += `<line x1="${L}" x2="${R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--faint)">${v}%</text>`;
  // 5-hour windows, one filled shape each
  const byWin = Object.values(Object.groupBy(fives, (f) => f.r));
  for (const w of byWin) {
    w.sort((a, b) => a.t - b.t);
    const pts = [{ t: w[0].r - FIVE, v: 0 }, ...w, { t: w[0].r, v: w.at(-1).v }];
    s += `<path d="${line(pts, (p) => p.v)}L${x(w[0].r)},${y(0)}Z" fill="color-mix(in srgb,var(--src-claude) 18%,transparent)" stroke="var(--src-claude)" stroke-opacity=".5"/>`;
  }
  // even pace, the tidemark, and the gap nobody used
  s += `<line x1="${x(start)}" y1="${y(0)}" x2="${x(r)}" y2="${y(100)}" stroke="var(--muted)" stroke-dasharray="5 4"/>`;
  s += `<line x1="${L}" x2="${R}" y1="${y(peak)}" y2="${y(peak)}" stroke="var(--src-claude)" stroke-dasharray="2 3" stroke-opacity=".8"/>`;
  s += `<text x="${L + 4}" y="${y(peak) - 5}" font-size="11" fill="var(--src-claude)">tidemark ${peak}%</text>`;
  s += `<rect x="${R - 26}" y="${y(100)}" width="22" height="${y(peak) - y(100)}" rx="3" fill="color-mix(in srgb,var(--warn) 22%,transparent)" stroke="var(--warn)"/>`;
  s += `<text x="${R - 32}" y="${y(100) + 12}" text-anchor="end" font-size="12" fill="var(--warn)">${100 - peak}% expired ▸</text>`;
  if (cx.length) s += `<path d="${line([{ t: start, v: 0 }, ...cx], (p) => p.v)}" stroke="var(--src-codex)" stroke-width="2" fill="none"/><text x="${x(cx.at(-1).t) - 4}" y="${y(cx.at(-1).v) + 15}" text-anchor="end" font-size="11" fill="var(--src-codex)">Codex</text>`;
  s += `<path d="${line(weekly, (p) => p.v)}" stroke="var(--src-claude)" stroke-width="2.5" fill="none"/>`;
  s += `<text x="${L}" y="${B + 16}" font-size="11" fill="var(--faint)">window opens</text><text x="${R}" y="${B + 16}" text-anchor="end" font-size="11" fill="var(--faint)">reset</text>`;
  document.getElementById("fig").innerHTML = s;
  document.getElementById("used").textContent = `${peak}%`;
  document.getElementById("gone").textContent = `${100 - peak}%`;
</script>
</body>
</html>
