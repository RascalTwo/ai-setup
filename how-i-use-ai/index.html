/* viz-kit.css — the /viz house style. Load with:
     <link rel="stylesheet" href="/_kit/viz-kit.css">
   Served by the viz server at /_kit/viz-kit.css from the skill's own kit/ dir.

   Why this exists: nearly every viz independently re-derived the same dark theme
   (a GitHub-dark palette), re-guessed the exact hexes (so the "same" background
   drifted across files), and invented its own variable names (--txt vs --text vs
   --ink) for identical concepts. This file fixes the palette and the names ONCE so
   you can reach for var(--accent) / var(--good) instead of re-picking colors.

   The dark GitHub-ish palette is the DEFAULT, not a constraint. Every rule below
   reads its colors through var() — there is not one hardcoded hex outside :root —
   so a page needing a brand or one-off palette overrides the tokens in a later
   :root and keeps every component. Re-theme; don't fork. See kit/README.md. */

:root {
  /* Surfaces, back to front */
  --bg: #0d1117;
  --panel: #161b22;
  --panel-2: #21262d;
  --border: #30363d;

  /* Text — three tiers. --faint is for de-emphasized chrome (axis ticks, units,
     footnotes, "n of m" counters); 72 vizzes re-derived a third tier by hand
     before it existed here, at half a dozen different grays. */
  --text: #e6edf3;
  --muted: #8b949e;
  --faint: #6e7681;

  /* Intent — accents that carry meaning */
  --accent: #58a6ff; /* primary / links / selection */
  --good: #3fb950; /* success / healthy / "yes" */
  --warn: #d29922; /* caution / pending */
  --danger: #f85149; /* error / blocked / "no" */

  /* Categorical ramp — visually separable hues for diagram categories / series.
     Use these when you need N separable colors, NOT meaning.

     ⚠ ALIASING TRAP — c1/c2/c3/c6 are byte-identical to the intent colors above:
       --c1 == --accent   --c2 == --good   --c3 == --warn   --c6 == --danger
     So a categorical series rendered in --c2 reads as "success" next to anything
     using --good, and --c6 reads as "error". Only --c4, --c5, --c7, --c8 are
     unique to this ramp. This has already caused rework (a poster themed on --c2
     went monochrome against a --good meter and had to be re-themed to --c5).
     If your viz mixes categorical series WITH semantic color, pick from
     --c4/--c5/--c7/--c8 first, then reach for the aliased four knowingly.

     The four aliased slots are DEFINED AS the intent colors rather than repeating
     their hexes. That's deliberate: the aliasing is self-evident wherever you read
     this file, it cannot drift, and a re-theme keeps them in sync automatically.
     The slots with a literal hex are the meaning-free ones. */
  --c1: var(--accent); /* blue  — ALIAS, reads as "primary/selected" */
  --c2: var(--good); /* green — ALIAS, reads as "success" */
  --c3: var(--warn); /* amber — ALIAS, reads as "caution" */
  --c4: #bc8cff; /* purple — meaning-free */
  --c5: #4ec9b0; /* teal   — meaning-free */
  --c6: var(--danger); /* red — ALIAS, reads as "error" */
  --c7: #5d52b4; /* indigo  — meaning-free (ΔE 21.3 from the nearest intent color) */
  --c8: #b70385; /* magenta — meaning-free (ΔE 20.9) */
  /* No orange slot exists on purpose: every orange sits between --danger (hue 27°)
     and --warn (80°), and none clears ΔE 15 from both under CVD simulation. The
     obvious #f0883e is ΔE 1.5 from --warn to a protanope — indistinguishable. */

  /* Type */
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  /* Spacing rhythm */
  --r: 8px;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
}
html {
  /* Paint the canvas itself. body is height:100% (one viewport), so on a page taller
     than the viewport the area BELOW the body box would otherwise reveal the browser's
     default (lighter) canvas when scrolled — showing as a horizontal "line" mid-page
     where body's --bg ends. Putting --bg on the root keeps the whole canvas dark. */
  background-color: var(--bg);
}

body {
  /* A faint top-glow over the flat background — the recurring "radial-gradient at
     60% 0%" idiom, standardized. Sized large and faded to transparent well past the
     fold (color-mix dilutes --panel) so the glow→--bg transition never forms a
     visible edge mid-page — the earlier tight 600px gradient left a "boundary" band. */
  background:
    radial-gradient(1600px 1000px at 50% -30%, color-mix(in srgb, var(--panel) 55%, transparent), transparent 75%),
    var(--bg);
  color: var(--text);
  font: 14px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Links. There was no bare `a` rule here until 2026-08-19, so every naked anchor
   in every viz fell through to the user-agent default: #0000EE on a #0d1117
   background (2.3:1 — below the 4.5:1 floor), and #551A8B once visited, which is
   1.5:1 and effectively invisible. Both tiers now come from tokens, so they follow
   a re-theme. --c4 keeps the "visited is purple" convention at 8.2:1 instead of
   abandoning it. Lowest possible specificity, so any component rule still wins. */
a {
  color: var(--accent);
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
}
a:visited { color: var(--c4); }
a:hover { color: var(--text); text-decoration-thickness: 2px; }

.viz-header {
  padding: 20px 24px;
}
.viz-header h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 650;
  letter-spacing: -0.01em;
}
.viz-header .sub,
.sub {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 12.5px;
}

/* Panels / cards */
.panel,
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: calc(var(--r) * 1.5);
  padding: 16px;
}

/* Slide-in detail drawer (click a node → details). Toggle .open. */
.drawer {
  position: fixed;
  top: 0;
  right: 0;
  height: 100%;
  width: min(420px, 90vw);
  background: var(--panel);
  border-left: 1px solid var(--border);
  transform: translateX(100%);
  transition: transform 0.2s ease;
  overflow: auto;
  padding: 20px;
  z-index: 50;
}
.drawer.open {
  transform: none;
}

/* Legend: the single most common component (~16/22), reinvented differently each
   time. Two swatch shapes: a filled square for nodes, a short rule for edge types. */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  font-size: 12px;
  color: var(--muted);
}
.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.swatch {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  flex: none;
  background: var(--accent);
}

   `height:0` + `border-top` until 2026-08-19, which made the documented way to
   colour a swatch — an inline `background:` — a silent no-op: every line swatch in
   the corpus rendered accent-blue regardless of what it was labelling. All 5
   usages passed `background`; none passed `border-top-color`. */

  width: 16px;
  height: 2px;
  border-radius: 0;

   hand-rolled a .dot/.sw at five different sizes — the shape was the blocker,
   not the component. */
.swatch.dot {
  border-radius: 50%;
}

/* Status / label pill — uppercase micro-badge. Recurs in ~120 files (the
   border-radius:999px + text-transform:uppercase idiom) and was re-derived at a
   different size almost every time. Modifiers tint text + border together. */
.pill {
  display: inline-block;
  font: 700 11px var(--sans);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid var(--border);
  color: var(--muted);
  white-space: nowrap;

.pill.accent {
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 50%, transparent);
}
.pill.good {
  color: var(--good);
  border-color: color-mix(in srgb, var(--good) 50%, transparent);
}
.pill.warn {
  color: var(--warn);
  border-color: color-mix(in srgb, var(--warn) 50%, transparent);
}
.pill.danger {
  color: var(--danger);
  border-color: color-mix(in srgb, var(--danger) 50%, transparent);
}

/* Animated "flow" edge — dashed line whose dashes drift along the path. The
   @keyframes was identical everywhere but for the offset magnitude; here it's one
   class. Apply to an SVG <path>/<line>: <path class="flow" .../>. */
@keyframes viz-dash {
  to {
    stroke-dashoffset: -20;
  }
}
.flow {
  stroke-dasharray: 6 4;
  animation: viz-dash 1s linear infinite;
}

/* Reduced motion. 108 of 161 corpus vizzes animate (rAF, @keyframes, transitions,
   setInterval); 3 guarded it. Guarding per-viz was never going to happen, so the
   kit does it once for everyone that links this file.

   Motion is not removed, it is collapsed: near-zero durations keep transition/
   animation END events firing, so state machines that advance on `transitionend`
   still advance instead of deadlocking (the usual bug in a naive
   `animation: none !important` reset).

   This cannot reach a JS rAF loop. If your viz animates in JS, gate it yourself:
     const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
   and jump to the end state instead of tweening to it. */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  /* The dashed-edge drift reads as decoration, not information — stop it dead
     rather than freezing it mid-dash. */
  .flow {
    animation: none !important;
  }
}

/* Auto-wrapping SVG label (see labelBox() in viz.js). Fills its <foreignObject>
   and centers; overflow is clipped, never spilled. */
.vsvg-label {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--text);
  font: 12px/1.25 var(--sans);
  overflow: hidden;
  padding: 2px 6px;
}

/* --- .elsewhere — third-party explainers -------------------------------------
   A pointer to somebody ELSE explaining the same thing. Deliberately its own
   look, because a page that cites standards needs three visually distinct
   kinds of evidence and a reader must never mistake one for another:

     normative   what makes the claim true      (RFC / NIST / regulator)
     first-party what we read or decided        (source code, our own choice)
     elsewhere   a second teacher               <- this

   "a different kind of thing" rather than as success or warning.

   Convention that makes it worth having: the `.why` line says what the source
   is actually good for, INCLUDING where it is thinner than its reputation. An
   unread link presented as authoritative is the exact impression this component
   exists to prevent. Pair it with a rot checker — external pages 404.  */
.elsewhere {
  border-left: 2px solid var(--c5);
  padding: 8px 0 2px 12px;
  margin-top: 12px;

.elsewhere > .lbl {
  display: block;
  font: 700 9px/1 var(--sans);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--c5);
  margin-bottom: 5px;

.elsewhere a {

  font-weight: 700;

.elsewhere a:hover { color: var(--c5) }

.elsewhere .why {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 0.92em;
  line-height: 1.55;
}

      <p class="sec-sub">Colour is the arc it belongs to. Click any card to jump straight to its principle.</p>
      <div class="creed-grid">
        ${P.map((p, i) => `
          <div class="creed-card" data-jump="${stopOf(i + 1)}" style="--c-l:${arcOf(i + 1).c}">
            <span class="n">${String(i + 1).padStart(2, "0")} · ${esc(p.tag)}</span>${p.creed}

}
function servesRow(p) {
  return `<div class="serves"><span class="sl">serves</span>${p.serves.map((k) => {
    const v = VALUES.find((x) => x.key === k);
    return `<button class="vtag" data-value="${k}" style="--vc:${v.c}" title="${esc(v.blurb)}"><i></i>${esc(v.label)}</button>`;
  }).join("")}</div>`;
}
function renderPrinciple(n) {

  const idx = n;
  return `
    <div class="reveal" style="--ac:${a.c}">
      <div class="watermark">${idx}</div>

          <h2 class="title">${esc(p.title)}</h2>
          ${servesRow(p)}
          <p class="lead">${p.lead}</p>
          <ul class="points">${p.points.map((pt) => `<li>${pt}</li>`).join("")}</ul>
        </div>
        <aside class="visual">
          <div class="frame">
            <div id="artslot">${p.interactive ? "" : ART[p.art]}</div>
            <div class="cap" id="artcap">${p.cap}</div>
            ${p.interactive ? `<div class="drivehint">drag the marker</div>` : ""}

        </aside>
      </div>
    </div>`;
}
function renderFoot(s) {
  const dots = Array.from({ length: TOTAL }, (_, i) => {
    const c = isP(i) ? arcOf(pnum(i)).c : "var(--accent)";
    const t = i === 0 ? "Thesis & the scorecard" : i === 1 ? "The compressed version" : esc(P[pnum(i) - 1].title);
    return `<button class="${i === s ? "on" : ""}" data-i="${i}" style="--dc:${c}" title="${t}"></button>`;
  }).join("");
  const counter = isP(s) ? `${pnum(s)} / ${N}` : s === 0 ? "thesis" : "creed";
  const last = s === TOTAL - 1;
  foot.innerHTML = `
    <button class="btn" id="prev" ${s === 0 ? "disabled" : ""}>← ${s === 0 ? "" : "Prev"}</button>
    <div class="dots">${dots}</div>
    <button class="btn primary" id="next" ${last ? "disabled" : ""} style="--ac:${isP(s) ? arcOf(pnum(s)).c : "var(--accent)"}">${last ? "End" : "Next"} →</button>
    <span class="counter">${counter}</span>`;

  document.getElementById("next").onclick = () => go(s + 1);

var PLANE = { x0: 40, x1: 284, y0: 190, y1: 60, maxW: 8, maxD: 5, base: 3.5, depthCost: 0.5 };
var RUNGS = ["chat", "autocomplete", "it writes fns", "it writes tests", "you're just the user"];
var plane = { w: 2, d: 3 };
var px = (w) => PLANE.x0 + (w - 1) / (PLANE.maxW - 1) * (PLANE.x1 - PLANE.x0);
var py = (d) => PLANE.y0 - (d - 1) / (PLANE.maxD - 1) * (PLANE.y0 - PLANE.y1);
var safeW = (d) => PLANE.base - (d - 1) * PLANE.depthCost;
var isSafe = (w, d) => w + (d - 1) * PLANE.depthCost <= PLANE.base;
function planeSVG() {
  const pts = [];
  for (let d = PLANE.maxD;d >= 1; d -= 0.25)
    pts.push(`${px(Math.max(1, safeW(d))).toFixed(1)},${py(d).toFixed(1)}`);
  const region = `M${px(1)},${py(PLANE.maxD)} L${pts.join(" L")} L${px(1)},${py(1)} Z`;
  const g = [];
  g.push(`<rect x="${PLANE.x0}" y="${PLANE.y1}" width="${PLANE.x1 - PLANE.x0}" height="${PLANE.y0 - PLANE.y1}" fill="var(--panel-2)" opacity=".35" rx="4"/>`);
  g.push(`<path d="${region}" fill="var(--good)" opacity=".16" stroke="var(--good)" stroke-width="1.5" data-viz-id="plane-safe" data-label="my rule-of-thumb boundary — where I reckon I can still explain the work"/>`);
  for (let d = 1;d <= PLANE.maxD; d++) {
    g.push(`<line x1="${PLANE.x0}" y1="${py(d)}" x2="${PLANE.x1}" y2="${py(d)}" stroke="var(--border)" stroke-width=".8"/>`);
    g.push(`<text x="${PLANE.x0 + 4}" y="${py(d) - 4}" class="s-txtm" style="font-size:8px" opacity=".85">${RUNGS[d - 1]}</text>`);
  }
  for (let w = 1;w <= PLANE.maxW; w++) {
    g.push(`<text x="${px(w)}" y="${PLANE.y0 + 13}" text-anchor="middle" class="s-txtm" style="font-size:9px">${w}</text>`);
  }
  g.push(`<text x="${(PLANE.x0 + PLANE.x1) / 2}" y="${PLANE.y0 + 27}" text-anchor="middle" class="s-txtm">concurrent sessions →</text>`);
  g.push(`<text x="${(PLANE.x0 + PLANE.x1) / 2}" y="${PLANE.y0 + 42}" text-anchor="middle" class="s-txtm" style="font-size:9px">one more session costs 2× one more rung</text>`);
  g.push(`<text x="${PLANE.x0}" y="${PLANE.y1 - 14}" class="s-txtm" style="font-size:9px">autonomy depth ↑</text>`);
  g.push(`<text x="${px(2.4)}" y="${py(1.55)}" class="s-txtm" style="font-size:8.5px" fill="var(--good)">still yours</text>`);
  g.push(`<text x="${PLANE.x1 - 4}" y="${PLANE.y1 + 14}" text-anchor="end" class="s-txtm" style="font-size:8.5px" fill="var(--danger)">carries your name anyway</text>`);
  const ok = isSafe(plane.w, plane.d);
  const c = ok ? "var(--good)" : "var(--danger)";
  g.push(`<line x1="${px(plane.w)}" y1="${PLANE.y0}" x2="${px(plane.w)}" y2="${py(plane.d)}" stroke="${c}" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>`);
  g.push(`<line x1="${PLANE.x0}" y1="${py(plane.d)}" x2="${px(plane.w)}" y2="${py(plane.d)}" stroke="${c}" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>`);
  g.push(`<circle cx="${px(plane.w)}" cy="${py(plane.d)}" r="9" fill="${c}" opacity=".22"/>`);
  g.push(`<circle cx="${px(plane.w)}" cy="${py(plane.d)}" r="5.5" fill="${c}" stroke="var(--bg)" stroke-width="1.5"
            data-viz-id="plane-marker" data-label="${plane.w} session(s) at depth ${plane.d}"/>`);
  return `<svg viewBox="0 0 300 240" role="img" id="planeSvg"
            style="touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none"
            aria-label="Depth versus width plane">${g.join("")}</svg>`;
}
function planeCaption() {
  const ok = isSafe(plane.w, plane.d);
  const msg = ok ? `I'd still back myself to explain <b>every one of them.</b>` : `<span style="color:var(--danger)">I would not back myself to explain all ${plane.w} — and they'd carry my name regardless.</span>`;
  return `<b>${plane.w}</b> session${plane.w > 1 ? "s" : ""} × <b>${RUNGS[plane.d - 1]}</b><br>${msg}` + `<br><span style="opacity:.7;font-size:11px">my line, drawn — not a measurement</span>`;
}
function mountPlane() {
  const slot = document.getElementById("artslot");
  const cap = document.getElementById("artcap");
  if (!slot)
    return;
  const draw = () => {
    slot.innerHTML = planeSVG();
    cap.innerHTML = planeCaption();
  };
  const set = (ev) => {
    const svg = slot.querySelector("#planeSvg");
    if (!svg)
      return;
    const r = svg.getBoundingClientRect();
    const sx = (ev.clientX - r.left) / r.width * 300;
    const sy = (ev.clientY - r.top) / r.height * 240;
    const w = Math.round(1 + (sx - PLANE.x0) / (PLANE.x1 - PLANE.x0) * (PLANE.maxW - 1));
    const d = Math.round(1 + (PLANE.y0 - sy) / (PLANE.y0 - PLANE.y1) * (PLANE.maxD - 1));
    const nw = Math.max(1, Math.min(PLANE.maxW, w));
    const nd = Math.max(1, Math.min(PLANE.maxD, d));
    if (nw !== plane.w || nd !== plane.d) {
      plane = { w: nw, d: nd };
      draw();
    }
  };
  let down = false;
  slot.addEventListener("pointerdown", (e) => {
    down = true;
    try {
      slot.setPointerCapture(e.pointerId);
    } catch (_) {}
    set(e);
  });
  slot.addEventListener("pointermove", (e) => {
    if (down)
      set(e);
  });
  const release = (e) => {
    down = false;
    if (e && e.pointerId != null) {
      try {

      } catch (_) {}
    }
  };

  slot.addEventListener("pointercancel", release);
  draw();
}
function wireMatrix() {
  const read = document.getElementById("mread");
  if (!read)
    return;
  const show = (key) => {
    const v = VALUES.find((x) => x.key === key);
    const n = P.filter((p) => p.serves.includes(key)).length;
    read.style.setProperty("--rc", v.c);
    read.innerHTML = `<span class="badge">${esc(v.label)}</span><span>${esc(v.blurb)} <span class="m">— ${n} of ${N} principles.</span></span>`;
  };
  const reset = () => {
    read.style.removeProperty("--rc");
    read.innerHTML = `<span class="badge">${filterValue ? "filtering" : "hover"}</span><span class="m">${filterValue ? `Highlighting the principles that serve <b>${esc(VALUES.find((v) => v.key === filterValue).label)}</b>. Click the row again to clear.` : "Point at a row to read what that value asks for. Click it to highlight which principles serve it; click a column to jump to that principle."}</span>`;
  };
  const paint = () => {
    stage.querySelectorAll(".mcell").forEach((c) => {
      c.classList.toggle("m-dim", !!filterValue && c.dataset["value"] !== filterValue);
    });
    paintRail(cur);
  };
  stage.querySelectorAll(".mrow-lbl, .mcell").forEach((el) => {
    el.addEventListener("mouseenter", () => show(el.dataset["value"]));
    el.addEventListener("mouseleave", reset);
  });
  stage.querySelectorAll(".mrow-lbl").forEach((el) => {
    el.addEventListener("click", () => {
      filterValue = filterValue === el.dataset["value"] ? null : el.dataset["value"];
      paint();
      reset();
    });
  });
  stage.querySelectorAll(".mcell, .mcol-lbl").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      go(+el.dataset["jump"]);
    });
  });
  paint();
  reset();
}
var cur = 0;
function go(s) {
  s = Math.max(0, Math.min(TOTAL - 1, s));
  cur = s;
  seen.add(s);
  stage.innerHTML = s === 0 ? renderThesis() : s === 1 ? renderCreed() : renderPrinciple(pnum(s));
  stage.scrollTop = 0;
  renderFoot(s);
  paintRail(s);
  stage.querySelectorAll(".creed-card[data-jump]").forEach((c) => c.onclick = () => go(+c.dataset["jump"]));
  stage.querySelectorAll(".vtag").forEach((t) => t.onclick = () => {
    filterValue = t.dataset["value"];
    go(0);
  });
  if (s === 0)
    wireMatrix();
  if (isP(s) && P[pnum(s) - 1].interactive)
    mountPlane();
  if (isP(s)) {
    const art = stage.querySelector(".visual svg");
    if (art && !art.getAttribute("aria-label")) {
      art.setAttribute("aria-label", "Illustration: " + P[pnum(s) - 1].cap.replace(/<[^>]+>/g, ""));
    }

}
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input,textarea"))
    return;
  if (e.key === "ArrowRight") {
    e.preventDefault();
    go(cur + 1);
  } else if (e.key === "ArrowLeft") {
    e.preventDefault();
    go(cur - 1);
  } else if (e.key === "Home") {
    go(0);
  } else if (e.key === "End") {
    go(TOTAL - 1);

buildRail();

go(typeof h.p === "number" ? h.p : 0);
