<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ai-tidemark — hero card</title>
<!-- The OG / hero card for ai-tidemark. `viz verify <url> --og` renders THIS file and
     clips to .og-card → og.auto.png. The figure is drawn from fixtures/demo.json (the
     same generated data the published page shows), so it never carries real usage.
     Plain fetch, no /_kit/viz.js: publish inlines kit CSS into a hero, not kit JS. -->
<style>
/* viz-kit.css — the /viz house style. Load with:
     <link rel="stylesheet" href="/_kit/viz-kit.css">
   Served by the viz server at /_kit/viz-kit.css from the skill's own kit/ dir.

   Why this exists: nearly every viz independently re-derived the same dark theme
   (a GitHub-dark palette), re-guessed the exact hexes (so the "same" background
   drifted across files), and invented its own variable names (--txt vs --text vs
   --ink) for identical concepts. This file fixes the palette and the names ONCE so
   you can reach for var(--accent) / var(--good) instead of re-picking colors.

   The dark GitHub-ish palette is the DEFAULT, not a constraint. Every rule below
   reads its colors through var() — there is not one hardcoded hex outside :root —
   so a page needing a brand or one-off palette overrides the tokens in a later
   :root and keeps every component. Re-theme; don't fork. See kit/README.md. */

:root {
  /* Surfaces, back to front */
  --bg: #0d1117;
  --panel: #161b22;
  --panel-2: #21262d;
  --border: #30363d;

  /* Text — three tiers. --faint is for de-emphasized chrome (axis ticks, units,
     footnotes, "n of m" counters); 72 vizzes re-derived a third tier by hand
     before it existed here, at half a dozen different grays. */
  --text: #e6edf3;
  --muted: #8b949e;
  --faint: #6e7681;

  /* Intent — accents that carry meaning */
  --accent: #58a6ff; /* primary / links / selection */
  --good: #3fb950; /* success / healthy / "yes" */
  --warn: #d29922; /* caution / pending */
  --danger: #f85149; /* error / blocked / "no" */

  /* Categorical ramp — visually separable hues for diagram categories / series.
     Use these when you need N separable colors, NOT meaning.

     ⚠ ALIASING TRAP — c1/c2/c3/c6 are byte-identical to the intent colors above:
       --c1 == --accent   --c2 == --good   --c3 == --warn   --c6 == --danger
     So a categorical series rendered in --c2 reads as "success" next to anything
     using --good, and --c6 reads as "error". Only --c4, --c5, --c7, --c8 are
     unique to this ramp. This has already caused rework (a poster themed on --c2
     went monochrome against a --good meter and had to be re-themed to --c5).
     If your viz mixes categorical series WITH semantic color, pick from
     --c4/--c5/--c7/--c8 first, then reach for the aliased four knowingly.

     The four aliased slots are DEFINED AS the intent colors rather than repeating
     their hexes. That's deliberate: the aliasing is self-evident wherever you read
     this file, it cannot drift, and a re-theme keeps them in sync automatically.
     The slots with a literal hex are the meaning-free ones. */
  --c1: var(--accent); /* blue  — ALIAS, reads as "primary/selected" */
  --c2: var(--good); /* green — ALIAS, reads as "success" */
  --c3: var(--warn); /* amber — ALIAS, reads as "caution" */
  --c4: #bc8cff; /* purple — meaning-free */
  --c5: #4ec9b0; /* teal   — meaning-free */
  --c6: var(--danger); /* red — ALIAS, reads as "error" */
  --c7: #5d52b4; /* indigo  — meaning-free (ΔE 21.3 from the nearest intent color) */
  --c8: #b70385; /* magenta — meaning-free (ΔE 20.9) */
  /* No orange slot exists on purpose: every orange sits between --danger (hue 27°)
     and --warn (80°), and none clears ΔE 15 from both under CVD simulation. The
     obvious #f0883e is ΔE 1.5 from --warn to a protanope — indistinguishable. */

  /* Type */
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  /* Spacing rhythm */
  --r: 8px;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
}
html {
  /* Paint the canvas itself. body is height:100% (one viewport), so on a page taller
     than the viewport the area BELOW the body box would otherwise reveal the browser's
     default (lighter) canvas when scrolled — showing as a horizontal "line" mid-page
     where body's --bg ends. Putting --bg on the root keeps the whole canvas dark. */
  background-color: var(--bg);
}

body {
  /* A faint top-glow over the flat background — the recurring "radial-gradient at
     60% 0%" idiom, standardized. Sized large and faded to transparent well past the
     fold (color-mix dilutes --panel) so the glow→--bg transition never forms a
     visible edge mid-page — the earlier tight 600px gradient left a "boundary" band. */
  background:
    radial-gradient(1600px 1000px at 50% -30%, color-mix(in srgb, var(--panel) 55%, transparent), transparent 75%),
    var(--bg);
  color: var(--text);
  font: 14px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Links. There was no bare `a` rule here until 2026-08-19, so every naked anchor
   in every viz fell through to the user-agent default: #0000EE on a #0d1117
   background (2.3:1 — below the 4.5:1 floor), and #551A8B once visited, which is
   1.5:1 and effectively invisible. Both tiers now come from tokens, so they follow
   a re-theme. --c4 keeps the "visited is purple" convention at 8.2:1 instead of
   abandoning it. Lowest possible specificity, so any component rule still wins. */
a {
  color: var(--accent);
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
}
a:visited { color: var(--c4); }
a:hover { color: var(--text); text-decoration-thickness: 2px; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* Header: title + one-line muted subtitle — the chrome ~19/22 vizzes open with. */
.viz-header {
  padding: 20px 24px;
}
.viz-header h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 650;
  letter-spacing: -0.01em;
}
.viz-header .sub,
.sub {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 12.5px;
}

/* Panels / cards */
.panel,
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: calc(var(--r) * 1.5);
  padding: 16px;
}

/* Slide-in detail drawer (click a node → details). Toggle .open. */
.drawer {
  position: fixed;
  top: 0;
  right: 0;
  height: 100%;
  width: min(420px, 90vw);
  background: var(--panel);
  border-left: 1px solid var(--border);
  transform: translateX(100%);
  transition: transform 0.2s ease;
  overflow: auto;
  padding: 20px;
  z-index: 50;
}
.drawer.open {
  transform: none;
}

/* Legend: the single most common component (~16/22), reinvented differently each
   time. Two swatch shapes: a filled square for nodes, a short rule for edge types. */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  font-size: 12px;
  color: var(--muted);
}
.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.swatch {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  flex: none;
  background: var(--accent);
}
/* Colour comes from `background` (inherited from .swatch), NOT border-top. It was
   `height:0` + `border-top` until 2026-08-19, which made the documented way to
   colour a swatch — an inline `background:` — a silent no-op: every line swatch in
   the corpus rendered accent-blue regardless of what it was labelling. All 5
   usages passed `background`; none passed `border-top-color`. */
.swatch.line {
  width: 16px;
  height: 2px;
  border-radius: 0;
}
/* Round swatch. Its absence is why 25 vizzes abandoned .swatch entirely and
   hand-rolled a .dot/.sw at five different sizes — the shape was the blocker,
   not the component. */
.swatch.dot {
  border-radius: 50%;
}

/* Status / label pill — uppercase micro-badge. Recurs in ~120 files (the
   border-radius:999px + text-transform:uppercase idiom) and was re-derived at a
   different size almost every time. Modifiers tint text + border together. */
.pill {
  display: inline-block;
  font: 700 11px var(--sans);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid var(--border);
  color: var(--muted);
  white-space: nowrap;
}
.pill.accent {
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 50%, transparent);
}
.pill.good {
  color: var(--good);
  border-color: color-mix(in srgb, var(--good) 50%, transparent);
}
.pill.warn {
  color: var(--warn);
  border-color: color-mix(in srgb, var(--warn) 50%, transparent);
}
.pill.danger {
  color: var(--danger);
  border-color: color-mix(in srgb, var(--danger) 50%, transparent);
}

/* Animated "flow" edge — dashed line whose dashes drift along the path. The
   @keyframes was identical everywhere but for the offset magnitude; here it's one
   class. Apply to an SVG <path>/<line>: <path class="flow" .../>. */
@keyframes viz-dash {
  to {
    stroke-dashoffset: -20;
  }
}
.flow {
  stroke-dasharray: 6 4;
  animation: viz-dash 1s linear infinite;
}

/* Reduced motion. 108 of 161 corpus vizzes animate (rAF, @keyframes, transitions,
   setInterval); 3 guarded it. Guarding per-viz was never going to happen, so the
   kit does it once for everyone that links this file.

   Motion is not removed, it is collapsed: near-zero durations keep transition/
   animation END events firing, so state machines that advance on `transitionend`
   still advance instead of deadlocking (the usual bug in a naive
   `animation: none !important` reset).

   This cannot reach a JS rAF loop. If your viz animates in JS, gate it yourself:
     const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
   and jump to the end state instead of tweening to it. */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  /* The dashed-edge drift reads as decoration, not information — stop it dead
     rather than freezing it mid-dash. */
  .flow {
    animation: none !important;
  }
}

/* Auto-wrapping SVG label (see labelBox() in viz.js). Fills its <foreignObject>
   and centers; overflow is clipped, never spilled. */
.vsvg-label {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--text);
  font: 12px/1.25 var(--sans);
  overflow: hidden;
  padding: 2px 6px;
}

/* --- .elsewhere — third-party explainers -------------------------------------
   A pointer to somebody ELSE explaining the same thing. Deliberately its own
   look, because a page that cites standards needs three visually distinct
   kinds of evidence and a reader must never mistake one for another:

     normative   what makes the claim true      (RFC / NIST / regulator)
     first-party what we read or decided        (source code, our own choice)
     elsewhere   a second teacher               <- this

   Uses --c5 (teal, one of the meaning-free categorical slots) so it reads as
   "a different kind of thing" rather than as success or warning.

   Convention that makes it worth having: the `.why` line says what the source
   is actually good for, INCLUDING where it is thinner than its reputation. An
   unread link presented as authoritative is the exact impression this component
   exists to prevent. Pair it with a rot checker — external pages 404.  */
.elsewhere {
  border-left: 2px solid var(--c5);
  padding: 8px 0 2px 12px;
  margin-top: 12px;
}
.elsewhere > .lbl {
  display: block;
  font: 700 9px/1 var(--sans);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--c5);
  margin-bottom: 5px;
}
.elsewhere a {
  color: var(--text);
  font-weight: 700;
  text-decoration: none;
  border-bottom: 1px solid var(--c5);
}
.elsewhere a:hover { color: var(--c5) }
.elsewhere .who { color: var(--faint); font-size: 0.85em; margin-left: 6px }
.elsewhere .why {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 0.92em;
  line-height: 1.55;
}

</style>
<style>
/* viz-og.css — the 1200×630 OG / hero card layout. Load AFTER viz-kit.css:

     <link rel="stylesheet" href="/_kit/viz-kit.css">
     <link rel="stylesheet" href="/_kit/viz-og.css">

   Why this exists: 94 hero.html files were authored before it, and NONE of them
   loaded the kit — every one re-typed the same ~90 lines of card CSS by hand. The
   drift is measurable: `.right` padding exists in six variants across the corpus,
   `.eyebrow` margin-bottom in three, `.chip` font-size in two. Worse, `.og-card`
   is not a convention but a CONTRACT — viz verify --og clips the screenshot to that
   element and errors without it — so a tooling dependency was being hand-retyped 93
   times. The values here are the modal ones from that corpus, so a card built on
   this file matches what the good heroes already looked like.

   Everything is expressed in viz-kit tokens, so a re-themed viz and its hero card
   stay in sync (the old hand-rolled heroes had a PARALLEL palette — --fg/--line
   instead of --text/--border, at different hexes, so a viz and its own card
   disagreed about what "the background" was).

   Anatomy — the shape ~50 of the 94 heroes converged on:

     .og-card                       1200×630, the element --og clips to
       .frame                       inset hairline border
       .left                        eyebrow / title / essence / sub / chips
       .right                       .panel (a figure, chart, or diagram)
                                      .panel-cap, your content, .foot > .stat

   Both columns are optional: drop .right for a full-bleed title card, or drop
   .left for a figure-only card. */

.og-card {
  width: 1200px;
  height: 630px;
  overflow: hidden;
  position: relative;
  display: flex;
  align-items: stretch;
  font-family: var(--sans);
  color: var(--text);
  /* Two off-screen colour washes + the flat background. Keeps a large dark card
     from reading as a flat rectangle; the anchors sit outside the frame so no
     gradient edge is ever visible inside it. */
  background:
    radial-gradient(1150px 620px at 6% -12%, color-mix(in srgb, var(--warn) 10%, transparent), transparent 58%),
    radial-gradient(980px 560px at 108% 8%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 60%),
    var(--bg);
}
/* Top sheen + bottom vignette. Pointer-events off so it never eats a click while
   you're composing the card in the live browser. */
.og-card::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.015), transparent 20%),
    radial-gradient(1400px 800px at 50% 130%, rgba(0, 0, 0, 0.5), transparent 60%);
}

.frame {
  position: absolute;
  inset: 22px;
  border: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
  border-radius: 18px;
  pointer-events: none;
}

/* ── Columns ─────────────────────────────────────────────────────────────── */

.og-card > .left {
  width: 618px;
  padding: 64px 16px 64px 72px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  z-index: 2;
}
.og-card > .right {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 56px 60px 56px 4px;
  position: relative;
  z-index: 2;
}

/* ── Left column ─────────────────────────────────────────────────────────── */

/* Small uppercase pill above the title — the category/context line. */
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  width: fit-content;
  margin-bottom: 30px;
  padding: 7px 14px;
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 14px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 10%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
}
.eyebrow .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 10px currentColor;
}

/* The headline. Deliberately huge — an OG card is read at thumbnail size in a
   Slack scroll, so the title has to survive being shrunk to ~300px wide. */
.og-card .title {
  font-size: 88px;
  line-height: 0.93;
  font-weight: 800;
  letter-spacing: -0.045em;
  margin: 0;
}
/* .hl tints a span inside title/essence — the one idea you want carrying colour. */
.og-card .title .hl,
.essence .hl {
  color: var(--warn);
}
.essence .hl2 {
  color: var(--good);
}

/* One-sentence claim under the title. This is the line people actually read. */
.essence {
  margin-top: 28px;
  max-width: 505px;
  font-size: 29px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.02em;
}

.og-card .sub {
  margin-top: 16px;
  max-width: 490px;
  font-size: 17px;
  line-height: 1.5;
  color: var(--muted);
}
.og-card .sub code {
  font-family: var(--mono);
  font-size: 0.9em;
  color: var(--text);
  background: var(--panel-2);
  padding: 1px 6px;
  border-radius: 4px;
  border: 1px solid var(--border);
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 30px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 13px;
  border-radius: 8px;
  font-family: var(--mono);
  font-size: 13.5px;
  color: var(--muted);
  background: var(--panel);
  border: 1px solid var(--border);
}
/* Tiny square tick before a chip's label. */
.chip .tk {
  width: 6px;
  height: 6px;
  border-radius: 2px;
  background: var(--warn);
  box-shadow: 0 0 6px color-mix(in srgb, var(--warn) 60%, transparent);
}

/* ── Right column: the figure panel ──────────────────────────────────────── */

.og-card .panel {
  width: 434px;
  padding: 20px 20px 16px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: linear-gradient(
    180deg,
    color-mix(in srgb, var(--panel) 92%, transparent),
    color-mix(in srgb, var(--bg) 92%, transparent)
  );
  box-shadow:
    0 30px 80px rgba(0, 0, 0, 0.45),
    inset 0 1px 0 rgba(255, 255, 255, 0.03);
}
.panel-cap {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 10px;
}
.panel-cap .t {
  font-family: var(--mono);
  font-size: 12.5px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
}
.panel-cap .s {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--faint);
}
/* An inline figure inside the panel. */
.og-card svg.graph {
  width: 100%;
  display: block;
}

/* Stat row under the figure. .stat.good / .warn / .danger tint the number. */
.foot {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 10px;
}
.stat .n {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  font-size: 28px;
  line-height: 1;
}
.stat.good .n { color: var(--good); }
.stat.warn .n { color: var(--warn); }
.stat.danger .n { color: var(--danger); }
.stat.accent .n { color: var(--accent); }
.stat .l {
  margin-top: 5px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--faint);
}
.stat .d {
  margin-top: 3px;
  max-width: 180px;
  font-size: 12.5px;
  line-height: 1.35;
  color: var(--muted);
}

/* ── Safe zone ───────────────────────────────────────────────────────────── */

/* Slack/X/Teams/WebEx/Discord centre-crop a link card, so keep anything that MUST
   survive inside the middle ~1080×565. Add class="show-safe" to .og-card while
   composing to see the guide; remove it before shooting (it renders in the shot). */
.og-card.show-safe::before {
  content: "";
  position: absolute;
  left: 60px;
  top: 32px;
  width: 1080px;
  height: 565px;
  border: 1px dashed color-mix(in srgb, var(--danger) 55%, transparent);
  border-radius: 8px;
  pointer-events: none;
  z-index: 3;
}

</style>
<style>
  :root { --src-claude: var(--c4); --src-codex: var(--c5); }
  html, body { margin: 0; background: #05060a; }
  .graph text { font-family: var(--mono); }
</style>
</head>
<body>

<div class="og-card">
  <div class="frame"></div>

  <div class="left">
    <div class="eyebrow"><span class="dot"></span>ai-tidemark</div>

    <h1 class="title">You paid for it.<br><span class="hl">Did you use it?</span></h1>

    <div class="essence">
      tidemark keeps the <span class="hl">high-water mark</span> of every
      5-hour and weekly window before the reset erases it.
    </div>


    <div class="chips">
      <span class="chip"><span class="tk"></span>5-hour + weekly</span>
      <span class="chip"><span class="tk"></span>Claude Code · Codex</span>
      <span class="chip"><span class="tk"></span>local data only</span>
    </div>
  </div>

  <div class="right">
    <div class="panel">
      <div class="panel-cap">
        <span class="t">One week, used vs. paid for</span>
        <span class="s">demo data</span>
      </div>
      <svg class="graph" id="fig" viewBox="0 0 392 200" fill="none" xmlns="http://www.w3.org/2000/svg"
           data-viz-id="hero-week" data-label="One demo week: weekly use against even pace, with the unused gap to 100%"></svg>
      <div class="foot">
        <div class="stat accent"><div class="n" id="used">—</div><div class="l">used</div><div class="d">the week's high-water mark</div></div>
        <div class="stat warn"><div class="n" id="gone">—</div><div class="l">expired</div><div class="d" id="goneD">reset away, unused</div></div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="./hero.js"></script>
</body>
</html>
